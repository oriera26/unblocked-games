# Quan es puja una tag que comença per `v` (p. ex. v1.0.0) compila
# l'app per a Windows i per a Linux i la penja com a release de GitHub,
# amb exactament dos fitxers:
#
#   Windows: instal·lador NSIS (.exe)
#   Linux:   paquet .deb (Debian/Ubuntu)
#
# La tag es crea des de fora del workflow (git tag / llançament manual),
# així que un push ordinari a `main` no llança cap release.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            comanda: npm run dist
          - os: ubuntu-latest
            comanda: npm run dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instal·la dependències
        run: npm ci

      - name: Compila l'app
        run: ${{ matrix.comanda }}

      - uses: actions/upload-artifact@v4
        with:
          name: distribucio-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          # Només dos fitxers: l'instal·lador de Windows (.exe) i el
          # paquet de Debian/Ubuntu (.deb). Res més: l'AppImage, el
          # blockmap i els latest*.yml sobren (aquests dos últims només
          # els faria servir una auto-actualització, i l'app no en té).
          files: |
            dist/*.exe
            dist/*.deb
          generate_release_notes: true
