# Publica el lloc estàtic a GitHub Pages a cada push a `main`.
#
# Fonts: els mateixos fitxers del repo (index.html, manifest, service
# worker i assets/), res construït: el que es desa és el que es serveix.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # La mateixa verificació local (portades, mòduls, servidor) abans de
  # publicar: si `check-all` no passa, no es publica res.
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Comprova el projecte
        run: node tools/check-all.mjs --no-open

  publica:
    needs: verifica
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepara el lloc
        run: |
          mkdir -p _site
          cp index.html offline.html manifest.json service-worker.js .nojekyll googlea299b6218e33ce08.html _site/
          cp -r assets _site/assets

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
