# Publica el lloc estàtic a GitHub Pages a cada push a `main`.
#
# Fonts: els mateixos fitxers del repo (index.html, manifest, service
# worker i assets/), res construït: el que es desa és el que es serveix.
#
# La verificació (portades, mòduls, servidor) és local: `npm run check`
# amb les tools de `tools/`, que viuen al disc però no es versionen. Ací
# només es publica.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepara el lloc
        run: |
          mkdir -p _site
          cp index.html offline.html manifest.json service-worker.js .nojekyll googlea299b6218e33ce08.html _site/
          cp -r assets _site/assets

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
