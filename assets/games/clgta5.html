<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GTA 5</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        #fallback {
            display: none;
            height: 100%;
            width: 100%;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            box-sizing: border-box;
        }
        #fallback a {
            color: #7cc576;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!--
    GTA 5 — carrega directe des del servidor original de playgta5.com.

    El motor (game.wasm, ~63 MB) i els assets del joc (.rpf, mapa, vehicles, peds, etc.)
    es descarreguen de https://playgta5.com/ perquè el servidor envia les capçaleres
    Cross-Origin-Resource-Policy: same-origin i no permet que un altre domini els carregui.
    Per això el joc s'executa en un iframe apuntant directament a playgta5.com.
    -->
    <iframe src="https://playgta5.com/" allowfullscreen allow="autoplay"></iframe>

    <div id="fallback">
        <p>El joc no s'ha pogut carregar en iframe.</p>
        <p>Obre-la directament al seu servidor:
        <a href="https://playgta5.com/" target="_blank" rel="noopener">playgta5.com</a></p>
    </div>

    <script>
        // Si l'iframe no carrega en uns segons, es mostra l'enllaç de fallback per obrir el joc en una pestanya nova.
        const iframe = document.getElementById('frame');
        const fallback = document.getElementById('fallback');
        let timedOut = false;
        setTimeout(() => { timedOut = true; check(); }, 6000);
        iframe.addEventListener('load', () => { timedOut = false; check(); });
        iframe.addEventListener('error', () => { check(); });
        function check() {
            if (timedOut) fallback.style.display = 'flex';
        }
    </script>
</body>
</html>
