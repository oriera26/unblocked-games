<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemple d'iFrame a pantalla completa</title>
    <style>
        /* Elimina els marges predeterminats del navegador */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Evita barres de desplaçament dobles */
            background-color: #f4f4f4;
        }

        /* Configura l'iframe perquè ocupi tot l'espai disponible */
        iframe {
            width: 100%;
            height: 100%;
            border: none; /* Elimina la vora predeterminada */
            display: block; /* Evita espais buits a la part inferior */
        }
    </style>
</head>
<body>

    <!-- Reemplaça la URL de 'src' amb la pàgina o recurs que vulguis mostrar -->
    <iframe 
        src="https://icedodo.io/" 
        title="Contingut extern incrustat"
        loading="lazy"
        sandbox="allow-scripts allow-same-origin allow-forms">
        <p>El teu navegador no admet elements iframe. 
           Pots visitar la pàgina directament <a href="https://icedodo.io/">aquí</a>.
        </p>
    </iframe>

</body>
</html>
