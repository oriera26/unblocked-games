<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Penalty Shooters 3 - Unblocked</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* Estils per assegurar que el joc ocupi tota la pantalla sense marges */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
        }

        /* Botó flotant per si es perd el focus */
        #focus-btn {
            position: fixed;
            bottom: 10px;
            right: 10px;
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: 1px solid #555;
            border-radius: 5px;
            cursor: pointer;
            z-index: 100;
            font-size: 12px;
            transition: background 0.3s;
        }

        #focus-btn:hover {
            background: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Carreguem directament la font del joc evitant el SDK de GameDistribution -->
        <iframe 
            id="penalty-game"
            src="https://html5.gamedistribution.com/rvvASMiM/ac793d41fb5845e59afaad6292e141e1/index.html" 
            allow="autoplay; fullscreen; keyboard"
            scrolling="no"
            frameborder="0">
        </iframe>
    </div>

    <button id="focus-btn" onclick="focusGame()">Activar Teclat / Focus</button>

    <script>
        // Funció per assegurar que el joc tingui el focus del teclat
        function focusGame() {
            const frame = document.getElementById('penalty-game');
            if (frame) {
                frame.focus();
                console.log("Focus enviat al joc.");
            }
        }

        // Intentar donar focus automàticament en carregar
        window.onload = function() {
            setTimeout(focusGame, 1000);
        };

        // Escoltador per si l'usuari clica fora, facilitar la tornada al joc
        window.addEventListener('click', function() {
            // No forcem focus cada vegada per no molestar la interfície, 
            // però el botó està disponible.
        });
    </script>
</body>
</html>
