<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="color-scheme" content="dark">
        <meta name="theme-color" content="#0a0a1a">
        <title>GTA Vice City Online</title>
        <style>
            /*
             * El joc ve de fora: la pàgina de gtavice.city carrega el motor
             * pel seu compte, aquí només cal obrir-la a mida de pantalla.
             * El fons fosc evita un destell blanc mentre carrega.
             */
            html,
            body {
                height: 100%;
                margin: 0;
                background: #0a0a1a;
                overflow: hidden;
            }

            iframe {
                display: block;
                width: 100%;
                height: 100%;
                border: 0;
            }
        </style>
    </head>
    <body>
        <iframe
            src="https://www.gtavice.city/"
            title="GTA Vice City Online"
            allow="autoplay; fullscreen; gamepad"
            loading="eager"></iframe>
    </body>
</html>
