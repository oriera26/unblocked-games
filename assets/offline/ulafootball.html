<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ulaFootball</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<style>
/* ulaFootball — interfaz.
   Concepto: grafismo de retransmisión deportiva. Bloques inclinados anclados al
   borde izquierdo sobre el estadio en directo; amarillo de tarjeta como único acento. */
:root {
  color-scheme: dark;
  --night: #070b14;
  --panel: #0e1626;
  --panel-2: #17233b;
  --line: #2a3a5e;
  --chalk: #f3f5f9;
  --mute: #93a3c4;
  --card: #ffd23f;
  --card-ink: #17130a;
  --turf: #2bb673;
  --red: #e5484d;
  --display: "Big Shoulders Display", "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --ui: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --skew: -9deg;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--chalk);
  font-family: var(--ui);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}
#app {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--night);
  font-size: clamp(11px, 0.55vw + 0.9vh, 23px);
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#ui, #hud { position: absolute; inset: 0; }
#hud { pointer-events: none; }
#fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
#fade.cut { animation: cut 0.32s ease-out; }
@keyframes cut { 0% { opacity: 1; } 35% { opacity: 1; } 100% { opacity: 0; } }
.fatal { position: absolute; left: 16px; right: 16px; bottom: 16px; padding: 0.8em 1em; background: var(--red); color: #fff; font-size: 1.1em; z-index: 9; }

button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
h1, h2, h3, p { margin: 0; }
kbd {
  font: 700 0.8em var(--ui);
  background: var(--chalk); color: var(--night);
  padding: 0.1em 0.5em; border-radius: 0.2em; margin-right: 0.45em; letter-spacing: 0.04em; white-space: nowrap;
}
.mute { color: var(--mute); }
.sm { font-size: 0.92em; }

/* ---------------------------------------------------------------- pantallas */
.screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; gap: 1.1em;
  padding-block: 2em;
  padding-inline: max(16px, 3.2em);
  background: linear-gradient(100deg, rgba(7, 11, 20, 0.94) 0%, rgba(7, 11, 20, 0.78) 45%, rgba(7, 11, 20, 0.35) 100%);
  overflow-y: auto;
}
.hint { margin-top: auto; display: flex; flex-wrap: wrap; gap: 0.4em 1.6em; color: var(--mute); font-size: 1em; padding-top: 0.6em; }
.hint span { white-space: nowrap; }

.btn {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 0.5em 1.5em; min-height: 2.4em;
  font: 700 1.25em var(--ui); letter-spacing: 0.06em;
  background: var(--panel-2); border: 2px solid var(--line);
  transform: skewX(var(--skew));
}
.btn.go { background: var(--turf); border-color: var(--turf); color: #04170d; }
.btn.big { font-size: 1.7em; padding: 0.5em 2em; }
.btn.focus, .btn:focus-visible { background: var(--card); border-color: var(--card); color: var(--card-ink); outline: none; }

.head { display: flex; align-items: baseline; gap: 1em; flex-wrap: wrap; }
.head h1 { font: 900 3.2em/0.95 var(--display); letter-spacing: 0.02em; text-wrap: balance; }
.head-step { font: 700 1.1em var(--ui); color: var(--card-ink); background: var(--card); padding: 0.1em 0.7em; transform: skewX(var(--skew)); }
.head-team { margin-left: auto; display: flex; align-items: center; gap: 0.6em; font-size: 1.4em; }
.head-team img { width: 2em; height: 2em; }

/* -------------------------------------------------------------------- portada */
.s-splash { justify-content: center; align-items: flex-start; gap: 2.4em; background: linear-gradient(100deg, rgba(7, 11, 20, 0.92) 0%, rgba(7, 11, 20, 0.55) 55%, rgba(7, 11, 20, 0.1) 100%); }
.logo-top, .brand-s { font: 700 1.3em var(--ui); letter-spacing: 0.5em; color: var(--card); }
.logo h1 { font: 900 9.5em/0.82 var(--display); letter-spacing: -0.01em; text-transform: uppercase; transform: skewX(var(--skew)); transform-origin: left bottom; }
.logo h1 em, .brand em { font-style: normal; color: var(--card); }
.logo-line { height: 0.5em; width: 62%; margin-top: 1.2em; background: repeating-linear-gradient(90deg, var(--chalk) 0 2.2em, transparent 2.2em 3.4em); transform: skewX(-40deg); transform-origin: left; }
.press { font: 700 1.5em var(--ui); letter-spacing: 0.14em; padding: 0.5em 1.2em; background: var(--card); color: var(--card-ink); transform: skewX(var(--skew)); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.55; } }
.splash-note { color: var(--mute); font-size: 1.05em; }

/* ------------------------------------------------------------ menú principal */
.brand { display: flex; flex-direction: column; }
.brand b { font: 900 4.6em/0.85 var(--display); transform: skewX(var(--skew)); transform-origin: left bottom; }
.menu { display: flex; flex-direction: column; gap: 0.35em; margin-top: 0.8em; max-width: 44em; }
.mi {
  display: grid; grid-template-columns: 2.6em 1fr; align-items: baseline; column-gap: 0.4em;
  padding: 0.28em 1.2em 0.28em 0.9em;
  border-left: 0.35em solid transparent;
  transform: skewX(var(--skew)); transform-origin: left;
  transition: transform 0.12s ease-out, background 0.12s;
}
.mi-n { font: 700 1.1em var(--ui); color: var(--mute); }
.mi-t { font: 800 2.7em/1 var(--display); letter-spacing: 0.02em; }
.mi-t small { font: 700 0.34em var(--ui); letter-spacing: 0.16em; margin-left: 0.9em; color: var(--mute); vertical-align: middle; border: 1px solid var(--line); padding: 0.1em 0.5em; }
.mi-d { grid-column: 2; color: var(--mute); font-size: 1.05em; max-height: 0; overflow: hidden; transition: max-height 0.15s; }
.mi-soon .mi-t { color: #9aa6c2; }
.mi.focus { background: var(--card); color: var(--card-ink); border-left-color: var(--chalk); transform: skewX(var(--skew)) translateX(0.8em); }
.mi.focus .mi-n, .mi.focus .mi-d, .mi.focus .mi-t, .mi.focus .mi-t small { color: var(--card-ink); border-color: var(--card-ink); }
.mi.focus .mi-d { max-height: 3em; }
.menu.compact .mi { grid-template-columns: 1fr; }
.menu.compact .mi-t { font-size: 2em; }
.record { position: absolute; right: max(16px, 3.2em); bottom: 4.6em; background: rgba(14, 22, 38, 0.86); border-top: 0.25em solid var(--card); padding: 0.9em 1.3em; }
.record h3 { font: 700 1em var(--ui); letter-spacing: 0.2em; color: var(--mute); margin-bottom: 0.3em; }
.record-row { display: grid; grid-template-columns: repeat(4, auto); column-gap: 1.3em; row-gap: 0; align-items: end; font-variant-numeric: tabular-nums; }
.record-row b { font: 900 2.4em/1 var(--display); grid-row: 1; }
.record-row span { font-size: 0.8em; letter-spacing: 0.12em; color: var(--mute); grid-row: 2; }
.record-sub { margin-top: 0.5em; color: var(--mute); }

.modal { margin: auto 0; max-width: 34em; background: var(--panel); border-left: 0.4em solid var(--card); padding: 1.8em 2em; display: flex; flex-direction: column; gap: 0.9em; align-items: flex-start; }
.modal h2 { font: 900 3em/1 var(--display); }
.modal p { font-size: 1.25em; line-height: 1.35; }
.modal-tag, .report-tag { font: 700 1em var(--ui); letter-spacing: 0.24em; color: var(--card-ink); background: var(--card); padding: 0.1em 0.7em; align-self: flex-start; transform: skewX(var(--skew)); }

/* ----------------------------------------------------------------- equipos */
.vs-wrap { display: flex; align-items: stretch; gap: 1.2em; flex-wrap: wrap; }
.team { flex: 1 1 18em; min-width: 0; background: rgba(14, 22, 38, 0.9); border-top: 0.45em solid var(--tc); padding: 1em 1.3em 1.2em; display: flex; flex-direction: column; gap: 0.8em; position: relative; }
.team.mine { box-shadow: inset 0 0 0 2px var(--card); }
.team-tag { font: 700 1.05em var(--ui); letter-spacing: 0.24em; color: var(--mute); display: flex; gap: 0.8em; align-items: center; }
.team-tag b { background: var(--card); color: var(--card-ink); padding: 0 0.6em; letter-spacing: 0.1em; }
.team-tag i { font-style: normal; border: 1px solid var(--line); padding: 0 0.6em; letter-spacing: 0.1em; }
.team-pick { display: flex; align-items: center; gap: 0.8em; padding: 0.5em; border: 2px solid transparent; }
.team-pick.focus, .row.focus, .slider.focus { border-color: var(--card); background: rgba(255, 210, 63, 0.09); }
.team-id { flex: 1; min-width: 0; display: grid; grid-template-columns: auto 1fr; column-gap: 1em; align-items: center; }
.team-id .crest { width: 6.4em; height: 6.4em; grid-row: 1 / 3; filter: drop-shadow(0 0.3em 0.5em rgba(0, 0, 0, 0.5)); }
.team-id h2 { font: 900 2.5em/0.95 var(--display); align-self: end; overflow-wrap: anywhere; }
.team-id p { color: var(--mute); font-size: 1.1em; align-self: start; }
.arrow { font-size: 1.5em; width: 1.7em; height: 1.7em; display: grid; place-items: center; background: var(--panel-2); border: 1px solid var(--line); flex: none; }
.arrow:hover { background: var(--card); color: var(--card-ink); }
.arrow.sm { font-size: 0.9em; }
.team-ovr { position: absolute; top: 0.9em; right: 1.2em; text-align: right; line-height: 1; }
.team-ovr b { font: 900 2.8em/0.9 var(--display); display: block; color: var(--card); }
.team-ovr span { font-size: 0.8em; letter-spacing: 0.16em; color: var(--mute); }
.stats { display: flex; flex-direction: column; gap: 0.35em; }
.stat { display: grid; grid-template-columns: 5.2em 1fr 2em; align-items: center; gap: 0.7em; font-variant-numeric: tabular-nums; }
.stat-l { font-size: 0.95em; letter-spacing: 0.14em; color: var(--mute); }
.stat-b { height: 0.6em; background: var(--panel-2); transform: skewX(-25deg); overflow: hidden; }
.stat-b i { display: block; height: 100%; background: linear-gradient(90deg, var(--tc), var(--ta)); }
.stat-v { font: 700 1.25em var(--ui); text-align: right; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 1em; flex-wrap: wrap; padding: 0.4em 0.6em; border: 2px solid transparent; }
.row-l { font-size: 1em; letter-spacing: 0.16em; color: var(--mute); }
.row-v { display: flex; align-items: center; gap: 0.6em; flex-wrap: wrap; }
.row-v b { font: 700 1.3em var(--ui); letter-spacing: 0.04em; min-width: 5em; text-align: center; }
.row-v.full { flex: 1; justify-content: space-between; }
.chip { display: inline-flex; align-items: center; gap: 0.5em; padding: 0.2em 0.7em; border: 1px solid var(--line); font-weight: 700; letter-spacing: 0.06em; }
.chip.on { background: var(--chalk); color: var(--night); border-color: var(--chalk); }
.kit { display: inline-flex; flex-direction: column; width: 1.15em; height: 1.4em; outline: 1px solid rgba(255, 255, 255, 0.45); }
.kit i { display: block; }
.kit-sl { display: none; }
.kit-body { flex: 7; }
.kit-sh { flex: 3; }
.style { display: flex; gap: 0.6em; flex-wrap: wrap; }
.style span { font-size: 0.95em; letter-spacing: 0.12em; border: 1px solid var(--line); padding: 0.1em 0.6em; color: var(--mute); }
.vs { align-self: center; font: 900 3.4em var(--display); color: var(--card); transform: skewX(var(--skew)); }
.foot { display: flex; align-items: center; justify-content: space-between; gap: 1em; flex-wrap: wrap; }
.row-wide { background: rgba(14, 22, 38, 0.9); flex: 1 1 20em; }

/* ----------------------------------------------------------------- táctica */
.tac { display: flex; gap: 1.4em; align-items: flex-start; flex-wrap: wrap; }
.tac h3, .col h3 { font: 700 1em var(--ui); letter-spacing: 0.24em; color: var(--card); margin: 0.2em 0 0.4em; }
.tac-forms { display: flex; flex-direction: column; gap: 0.3em; flex: 0 0 9em; }
.opt { font: 800 1.7em var(--display); padding: 0.12em 0.7em; background: rgba(14, 22, 38, 0.9); border-left: 0.3em solid var(--line); transform: skewX(var(--skew)); }
.opt.on { border-left-color: var(--turf); color: var(--turf); }
.opt.focus { background: var(--card); color: var(--card-ink); border-left-color: var(--chalk); }
.pitch { flex: 1 1 22em; min-width: 0; max-width: 34em; perspective: 60em; padding-top: 0.5em; }
.pitch-in {
  position: relative; width: 100%; aspect-ratio: 68 / 74;
  background: repeating-linear-gradient(180deg, #2b7a35 0 12.5%, #318a3c 12.5% 25%);
  border: 0.18em solid rgba(255, 255, 255, 0.85);
  transform: rotateX(34deg); transform-origin: 50% 100%; transform-style: preserve-3d;
  box-shadow: 0 1.2em 2.4em rgba(0, 0, 0, 0.55);
}
.pl-mid { position: absolute; left: 0; right: 0; top: 14%; border-top: 0.14em solid rgba(255, 255, 255, 0.8); }
.pl-circle { position: absolute; left: 50%; top: 14%; width: 26%; aspect-ratio: 1; border: 0.14em solid rgba(255, 255, 255, 0.8); border-radius: 50%; transform: translate(-50%, -50%); }
.pl-box { position: absolute; left: 21%; right: 21%; border: 0.14em solid rgba(255, 255, 255, 0.8); }
.pl-box.a { bottom: 0; height: 19%; border-bottom: 0; }
.pl-box.b { display: none; }
.tok { position: absolute; transform: translate(-50%, -50%) rotateX(-34deg); transform-origin: 50% 100%; display: flex; flex-direction: column; align-items: center; line-height: 1.05; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9); white-space: nowrap; }
.tok b { width: 1.9em; height: 1.9em; display: grid; place-items: center; border-radius: 50%; background: var(--c); color: var(--n); font: 800 1.15em var(--ui); border: 2px solid rgba(255, 255, 255, 0.9); box-shadow: 0 0.3em 0.5em rgba(0, 0, 0, 0.5); }
.tok span { font-weight: 700; font-size: 0.95em; }
.tok em { font-style: normal; font-size: 0.75em; color: #d7e6d9; }
.tac-side { flex: 1 1 17em; min-width: 0; max-width: 24em; display: flex; flex-direction: column; gap: 0.35em; background: rgba(14, 22, 38, 0.9); padding: 0.9em 1.1em 1.1em; }
.slider { display: grid; grid-template-columns: 1fr auto; gap: 0.15em 0.8em; padding: 0.3em 0.6em; border: 2px solid transparent; }
.slider-l { font-size: 0.95em; letter-spacing: 0.14em; }
.slider-t { grid-column: 1 / 3; height: 0.55em; background: var(--panel-2); transform: skewX(-25deg); overflow: hidden; }
.slider-t i { display: block; height: 100%; background: var(--card); }
.slider-e { grid-column: 1 / 3; display: flex; justify-content: space-between; font-size: 0.8em; color: var(--mute); }
.slider-e em { font-style: normal; }
.slider-n { font-weight: 700; font-variant-numeric: tabular-nums; }
.tac-side .btn { margin-top: 0.7em; align-self: flex-start; }

/* ------------------------------------------------------- ajustes de partido */
.setup { display: flex; gap: 1.6em; flex-wrap: wrap; align-items: flex-start; }
.diffs { flex: 1 1 22em; min-width: 0; display: flex; flex-direction: column; gap: 0.5em; max-width: 36em; }
.diff { display: grid; grid-template-columns: 4.2em 1fr; column-gap: 0.8em; align-items: center; padding: 0.55em 1em; background: rgba(14, 22, 38, 0.9); border-left: 0.35em solid var(--line); transform: skewX(var(--skew)); }
.diff-n { grid-row: 1 / 3; color: var(--mute); letter-spacing: 0.12em; font-size: 0.9em; }
.diff b { font: 800 1.9em/1 var(--display); }
.diff span:last-child { color: var(--mute); font-size: 1.02em; }
.diff.on { border-left-color: var(--turf); }
.diff.on b { color: var(--turf); }
.diff.focus { background: var(--card); color: var(--card-ink); }
.diff.focus b, .diff.focus span { color: var(--card-ink); }
.opts { flex: 1 1 18em; min-width: 0; max-width: 28em; display: flex; flex-direction: column; gap: 0.4em; background: rgba(14, 22, 38, 0.9); padding: 0.9em 1.1em 1.2em; }
.opts .btn { margin-top: 0.8em; align-self: flex-start; }

.loading { margin: auto; text-align: center; display: flex; flex-direction: column; gap: 0.8em; align-items: center; }
.load-vs { display: flex; align-items: center; gap: 2em; }
.load-vs img { width: 9em; height: 9em; }
.load-vs b { font: 900 3.5em var(--display); color: var(--card); }
.loading h2 { font: 800 2.4em var(--display); text-wrap: balance; }
.loading p { color: var(--mute); font-size: 1.2em; letter-spacing: 0.12em; }
.s-loading { background: var(--night); }

.cols { display: flex; gap: 1.6em; flex-wrap: wrap; align-items: flex-start; }
.col { flex: 1 1 17em; min-width: 0; max-width: 30em; display: flex; flex-direction: column; gap: 0.35em; background: rgba(14, 22, 38, 0.9); padding: 0.9em 1.1em 1.2em; }
.col .btn { align-self: flex-start; margin-top: 0.5em; }
.keys { border-collapse: collapse; font-size: 1.12em; }
.keys td { padding: 0.22em 0.4em 0.22em 0; vertical-align: top; }

/* ------------------------------------------------------- pausa y resúmenes */
.s-pause, .s-half, .s-full { background: rgba(7, 11, 20, 0.82); }
.pause { margin: auto 0; display: flex; flex-direction: column; gap: 0.6em; }
.pause h1 { font: 900 4.2em/0.9 var(--display); color: var(--card); transform: skewX(var(--skew)); transform-origin: left; }
.pause-score { display: flex; align-items: center; gap: 1em; font-size: 1.35em; flex-wrap: wrap; }
.pause-score.big { font-size: 1.7em; justify-content: center; }
.sl-team { display: flex; align-items: center; gap: 0.5em; font-weight: 700; flex: 1 1 0; min-width: 0; justify-content: flex-end; text-align: right; }
.sl-team.r { justify-content: flex-start; text-align: left; }
.pause .sl-team { flex: 0 1 auto; }
.sl-team img { width: 2.2em; height: 2.2em; flex: none; }
.sl-score { font: 900 2.2em/1 var(--display); background: var(--chalk); color: var(--night); padding: 0.05em 0.5em; transform: skewX(var(--skew)); font-variant-numeric: tabular-nums; white-space: nowrap; }
.report { margin: auto; width: min(100%, 46em); display: flex; flex-direction: column; gap: 0.8em; }
.report-tag { align-self: center; }
.verdict { font: 900 4.4em/0.9 var(--display); text-align: center; color: var(--card); }
.scorers { display: grid; grid-template-columns: 1fr auto 1fr; gap: 1em; color: var(--mute); font-size: 1.1em; }
.scorers div { display: flex; flex-direction: column; align-items: flex-end; }
.scorers div:last-child { align-items: flex-start; }
.scorers .dot { width: 0.7em; height: 0.7em; border-radius: 50%; background: var(--chalk); margin-top: 0.3em; }
.stt { display: flex; flex-direction: column; gap: 0.3em; background: rgba(14, 22, 38, 0.9); padding: 0.9em 1.2em; font-variant-numeric: tabular-nums; }
.stt-r { display: grid; grid-template-columns: 4em 1fr 4em; align-items: center; gap: 0.8em; }
.stt-r > b { font: 700 1.3em var(--ui); text-align: center; }
.stt-m span { display: block; text-align: center; font-size: 0.85em; letter-spacing: 0.18em; color: var(--mute); }
.stt-b { display: flex; justify-content: space-between; height: 0.4em; background: var(--panel-2); gap: 2px; }
.stt-b i { background: var(--hc); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35); }
.stt-b u { background: var(--ac); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35); }
.report-btns { display: flex; gap: 1em; justify-content: center; flex-wrap: wrap; margin-top: 0.4em; }

/* --------------------------------------------------------------------- HUD */
.sb {
  position: absolute; top: max(16px, 1.4em); left: max(16px, 1.8em);
  display: flex; align-items: stretch; font-size: 1.15em;
  transform: skewX(var(--skew)); transform-origin: left top;
  box-shadow: 0 0.3em 0.9em rgba(0, 0, 0, 0.45);
}
.sb-team { display: flex; align-items: center; gap: 0.45em; padding: 0.25em 0.7em; background: var(--panel); font: 800 1.35em var(--ui); letter-spacing: 0.06em; }
.sb-team.h { border-bottom: 0.22em solid var(--hc); }
.sb-team.a { border-bottom: 0.22em solid var(--ac); }
.sb-crest { width: 1.5em; height: 1.5em; }
.sb-score { display: flex; align-items: center; gap: 0.3em; padding: 0 0.6em; background: var(--chalk); color: var(--night); font: 900 1.9em/1 var(--display); font-variant-numeric: tabular-nums; }
.sb-score i { font-style: normal; opacity: 0.5; }
.sb-clock { display: flex; align-items: center; gap: 0.4em; padding: 0 0.7em; background: var(--card); color: var(--card-ink); font: 700 1.3em var(--ui); font-variant-numeric: tabular-nums; }
.sb-half { font-style: normal; font-size: 0.75em; opacity: 0.75; }
.sb-time.extra { color: #a01218; }

.banner { position: absolute; left: 0; right: 0; top: 19%; display: flex; justify-content: center; }
.banner-in { display: flex; flex-direction: column; align-items: center; padding: 0.3em 2.2em 0.4em; background: rgba(14, 22, 38, 0.92); border-bottom: 0.3em solid var(--card); transform: skewX(var(--skew)); animation: slab 0.28s cubic-bezier(0.2, 0.9, 0.3, 1.2); }
.banner b { font: 900 3.2em/1 var(--display); letter-spacing: 0.03em; }
.banner span { font-size: 1.2em; color: var(--mute); letter-spacing: 0.08em; }
.banner.alert .banner-in { background: var(--red); border-bottom-color: #fff; }
.banner.alert span { color: #fff; }
.banner.yellow .banner-in { background: var(--card); color: var(--card-ink); border-bottom-color: var(--card-ink); }
.banner.yellow span { color: var(--card-ink); }
.banner.intro { top: auto; bottom: 14%; }
.banner.intro b { font-size: 2.6em; }
@keyframes slab { from { transform: skewX(var(--skew)) translateX(-3em); opacity: 0; } }

.goal { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 12vh; gap: 0.2em; }
.goal-word { font: 900 11em/0.85 var(--display); color: var(--chalk); -webkit-text-stroke: 0.03em var(--night); text-shadow: 0.06em 0.06em 0 var(--gc, #000), 0 0.15em 0.6em rgba(0, 0, 0, 0.6); transform: skewX(var(--skew)); animation: goal 0.5s cubic-bezier(0.2, 1.4, 0.4, 1); }
.goal-who { font-size: 1.7em; background: rgba(14, 22, 38, 0.92); padding: 0.15em 1.2em; border-bottom: 0.2em solid var(--card); }
@keyframes goal { from { transform: skewX(var(--skew)) scale(2.6); opacity: 0; } }

.replay { position: absolute; top: max(16px, 1.4em); right: max(16px, 1.8em); display: flex; flex-direction: column; align-items: flex-end; gap: 0.2em; }
.replay b { font: 900 2em var(--display); background: var(--red); padding: 0 0.6em; transform: skewX(var(--skew)); letter-spacing: 0.06em; }
.replay span { color: var(--chalk); background: rgba(7, 11, 20, 0.7); padding: 0 0.6em; }

.caption { position: absolute; left: 50%; bottom: max(16px, 1.3em); transform: translateX(-50%); max-width: min(46em, calc(100% - 32px)); text-align: center; font-size: 1.35em; line-height: 1.2; background: rgba(7, 11, 20, 0.82); padding: 0.25em 1em; border-left: 0.25em solid var(--card); }

.me { position: absolute; left: max(16px, 1.8em); bottom: max(16px, 1.4em); display: flex; align-items: stretch; transform: skewX(var(--skew)); transform-origin: left bottom; box-shadow: 0 0.3em 0.9em rgba(0, 0, 0, 0.45); }
.me-num { display: grid; place-items: center; min-width: 1.9em; background: var(--card); color: var(--card-ink); font: 900 2.2em var(--display); padding: 0 0.2em; }
.me-info { background: var(--panel); padding: 0.25em 0.9em 0.4em; min-width: 11em; }
.me-name { display: block; font: 700 1.35em var(--ui); white-space: nowrap; }
.me-pos { font-size: 0.9em; color: var(--mute); letter-spacing: 0.1em; }
.me-st { height: 0.3em; background: var(--panel-2); margin-top: 0.3em; }
.me-st i { display: block; height: 100%; background: var(--turf); }
.me-st i.low { background: var(--red); }

.power { position: absolute; left: 50%; bottom: 13%; transform: translateX(-50%); width: min(18em, 60%); text-align: center; }
.power-l { font: 700 1em var(--ui); letter-spacing: 0.16em; text-shadow: 0 1px 4px #000; }
.power-b { height: 0.75em; background: rgba(7, 11, 20, 0.75); border: 2px solid var(--chalk); transform: skewX(-25deg); overflow: hidden; margin-top: 0.2em; }
.power-b i { display: block; height: 100%; background: linear-gradient(90deg, var(--turf), var(--card)); }
.power-b i.hot { background: linear-gradient(90deg, var(--card), var(--red)); }

.help { position: absolute; right: max(16px, 1.8em); bottom: 4.6em; max-width: min(34em, 46%); background: rgba(7, 11, 20, 0.8); padding: 0.3em 0.9em; font-size: 1.05em; border-right: 0.25em solid var(--card); text-align: right; }
.radar { position: absolute; right: max(16px, 1.8em); top: max(16px, 1.4em); width: 12.5em; height: auto; opacity: 0.92; }
.cards { position: absolute; top: 5em; left: max(16px, 1.8em); display: flex; flex-direction: column; gap: 0.3em; }
.card-pop { display: flex; align-items: center; gap: 0.5em; background: rgba(14, 22, 38, 0.92); padding: 0.2em 0.8em 0.2em 0.4em; font-size: 1.15em; animation: slab 0.25s ease-out; }
.card-pop i { width: 0.7em; height: 1em; background: var(--card); }
.card-pop.r i { background: var(--red); }

@media (max-width: 700px) {
  .record { position: static; align-self: flex-start; }
  .logo h1 { font-size: 6em; }
  .radar { display: none; }
  .help { display: none; }
  .vs { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .press, .banner-in, .goal-word, .card-pop { animation: none; }
  .mi { transition: none; }
}
