<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>UnblockedGames by Ula</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="icon" type="image/x-icon" href="assets/icons/icon.ico">

    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#007AFF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">

    <style>
        :root {
            --glow-color-rgb: 0, 122, 255;
            --text-main: #1d1d1f;
            --accent: #007AFF;
            --bg-base: #eef1f6;

            /* ⚡ OPT #3: blur reduït de 48px → 16px */
            --glass-blur: 16px;
            --glass-saturate: 160%;

            --glass-bg: rgba(255, 255, 255, 0.22);
            --glass-bg-strong: rgba(255, 255, 255, 0.28);
            --glass-bg-soft: rgba(255, 255, 255, 0.14);
            --glass-border-soft: rgba(255, 255, 255, 0.22);
            --glass-shadow:
                0 12px 32px rgba(15, 20, 40, 0.10),
                0 4px 10px rgba(15, 20, 40, 0.06);

            --pill-bg: rgba(0, 0, 0, 0.04);
            --table-hover: rgba(255, 255, 255, 0.28);
            --fire-color: #ff4d00;
            --fav-glow: rgba(255, 214, 10, 0.3);
            --orb-opacity: 0.7;

            --glass-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
            --glass-filter-strong: blur(calc(var(--glass-blur) - 4px)) saturate(var(--glass-saturate));
            --glass-filter-small: blur(8px) saturate(140%);

            /* ⚡ OPT #4: --squircle-shadow eliminat (usem pseudo-element) */
        }

        .dark-theme {
            --glow-color-rgb: 10, 132, 255;
            --text-main: #f5f5f7;
            --accent: #0A84FF;
            --bg-base: #05060a;

            --glass-bg: rgba(26, 28, 34, 0.34);
            --glass-bg-strong: rgba(30, 32, 40, 0.42);
            --glass-bg-soft: rgba(28, 30, 38, 0.24);
            --glass-border-soft: rgba(255, 255, 255, 0.10);
            --glass-shadow:
                0 12px 40px rgba(0, 0, 0, 0.45),
                0 4px 12px rgba(0, 0, 0, 0.28);

            --pill-bg: rgba(255, 255, 255, 0.08);
            --table-hover: rgba(255, 255, 255, 0.05);
            --fav-glow: rgba(255, 214, 10, 0.2);
            --orb-opacity: 0.75;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body { overflow-x: hidden; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            transition: background 0.4s ease, color 0.4s ease;
            position: relative;
        }

        /* ==========================================================
           ⚡ OPT #2 + #11: ORB amb PNG pre-desenfocat i CSS keyframes
           ========================================================== */
        #orb-1 {
            position: fixed;
            top: 0;
            left: 0;
            width: 700px;
            height: 700px;
            pointer-events: none;
            z-index: 0;
            opacity: var(--orb-opacity);
            /* ⚡ OPT #2: PNG pre-desenfocat en comptes de filter: blur(90px) */
            background-image: url('/assets/images/orb-blurred.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            /* ⚡ OPT #11: animació CSS en comptes de JS */
            animation: orbPath 60s ease-in-out infinite;
            backface-visibility: hidden;
        }

        @keyframes orbPath {
            0%, 100% { transform: translate3d(calc(50vw - 350px), calc(34vh - 350px), 0); }
            20%      { transform: translate3d(calc(85vw - 350px), calc(50vh - 350px), 0); }
            40%      { transform: translate3d(calc(50vw - 350px), calc(66vh - 350px), 0); }
            60%      { transform: translate3d(calc(15vw - 350px), calc(50vh - 350px), 0); }
            80%      { transform: translate3d(calc(50vw - 350px), calc(34vh - 350px), 0); }
        }

        /* ⚡ OPT #1: la animació CSS s'atura automàticament quan la pestanya no és visible
           (els navegadors moderns ja pausen les CSS animations en background) */
        @media (prefers-reduced-motion: reduce) {
            #orb-1 { animation: none; transform: translate3d(calc(50vw - 350px), calc(34vh - 350px), 0); }
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 40%, var(--bg-base) 125%);
            opacity: 0.25;
        }

        /* ==========================================================
           NAV
           ========================================================== */
        nav {
            position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 30px); max-width: 900px; height: 56px;
            background: var(--glass-bg);
            /* ⚡ OPT #3: blur reduït */
            backdrop-filter: blur(12px) saturate(150%);
            -webkit-backdrop-filter: blur(12px) saturate(150%);
            border: 1px solid var(--glass-border-soft);
            border-radius: 28px; z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-shadow: var(--glass-shadow);
        }

        .nav-left, .nav-right, .nav-center { z-index: 1; }
        .nav-left, .nav-right { display: flex; align-items: center; gap: 15px; }

        .nav-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: var(--glass-bg-soft);
            padding: 4px;
            border-radius: 40px;
            backdrop-filter: var(--glass-filter-small);
            -webkit-backdrop-filter: var(--glass-filter-small);
            border: 1px solid var(--glass-border-soft);
        }

        .nav-link {
            font-size: 14px;
            font-weight: 600;
            padding: 6px 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
            color: var(--text-main);
            background: transparent;
            text-align: center;
            border: 1px solid transparent;
        }
        .nav-link:hover {
            background: var(--glass-bg);
            border-color: var(--glass-border-soft);
        }
        .nav-link.active {
            background: var(--accent);
            color: white;
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 4px 14px rgba(var(--glow-color-rgb), 0.30);
        }

        .logo {
            font-weight: 800;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            line-height: 0;
        }
        .logo-img {
            height: 34px;
            width: auto;
            transform-origin: left center;
            transition: transform 0.2s ease;
            object-fit: contain;
            display: block;
        }
        .logo:hover .logo-img { transform: scaleX(1.05); }

        /* ==========================================================
           CATEGORIES
           ========================================================== */
        .category-container {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: auto;
            max-width: 95vw;
        }

        .category-pill-wrapper {
            position: relative;
            background: var(--glass-bg-strong);
            backdrop-filter: blur(12px) saturate(150%);
            -webkit-backdrop-filter: blur(12px) saturate(150%);
            padding: 4px;
            border-radius: 20px;
            border: 1px solid var(--glass-border-soft);
            display: flex;
            gap: 2px;
            box-shadow: var(--glass-shadow);
            overflow-x: auto;
            scrollbar-width: none;
        }

        .category-item {
            position: relative;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: background 0.2s ease, opacity 0.2s ease;
            color: var(--text-main);
            opacity: 0.55;
            z-index: 2;
        }
        .category-item i { width: 13px; height: 13px; }
        .category-item.active { opacity: 1; color: #fff; }
        .category-item:hover {
            opacity: 0.9;
            background: var(--glass-bg);
        }

        .category-active-bg {
            position: absolute;
            top: 4px;
            left: 4px;
            height: calc(100% - 8px);
            background: var(--accent);
            border-radius: 16px;
            transition: left 0.35s cubic-bezier(0.16, 1, 0.3, 1), width 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 12px rgba(var(--glow-color-rgb), 0.30);
            z-index: 1;
            pointer-events: none;
        }

        /* ==========================================================
           SEARCH
           ========================================================== */
        .search-container {
            display: flex; align-items: center; position: relative;
            background: var(--glass-bg-soft);
            border: 1px solid var(--glass-border-soft);
            border-radius: 30px;
            padding: 2px 6px;
            backdrop-filter: var(--glass-filter-small);
            -webkit-backdrop-filter: var(--glass-filter-small);
            transition: background 0.2s ease;
        }
        .search-container:hover { background: var(--glass-bg); }

        .search-bar {
            width: 0; opacity: 0; padding: 6px 0; background: transparent;
            border: none;
            color: var(--text-main); font-size: 13px; outline: none;
            transition: width 0.3s ease, opacity 0.3s ease, padding 0.3s ease, margin 0.3s ease;
            pointer-events: none;
        }
        .search-container:hover .search-bar,
        .search-bar:focus {
            width: 140px; opacity: 1; padding: 6px 8px; margin-right: 4px;
            pointer-events: all;
        }

        .search-trigger {
            background: transparent;
            border: none;
            color: var(--text-main);
            opacity: 0.75;
            cursor: pointer;
            width: 28px; height: 28px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s ease, opacity 0.15s ease;
            -webkit-appearance: none;
            appearance: none;
            padding: 0;
        }
        .search-trigger:hover { opacity: 1; background: var(--glass-bg); }
        .search-trigger svg { display: block; }

        .theme-btn,
        .settings-btn {
            background: var(--glass-bg-soft);
            border: 1px solid var(--glass-border-soft);
            color: var(--text-main);
            opacity: 0.85;
            cursor: pointer;
            width: 32px; height: 32px;
            border-radius: 30px;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: var(--glass-filter-small);
            -webkit-backdrop-filter: var(--glass-filter-small);
            transition: background 0.15s ease, transform 0.15s ease;
            padding: 0;
        }
        .theme-btn:hover,
        .settings-btn:hover { background: var(--glass-bg); transform: scale(1.04); }
        .settings-btn.active {
            background: var(--accent);
            color: white;
            border-color: rgba(255,255,255,0.25);
            box-shadow: 0 4px 14px rgba(var(--glow-color-rgb), 0.30);
        }
        .settings-btn svg { transition: transform 0.3s ease; }
        .settings-btn.active svg { transform: rotate(45deg); }

        /* ==========================================================
           SETTINGS MENU
           ========================================================== */
        .settings-wrap { position: relative; display: flex; align-items: center; }

        .settings-menu {
            position: absolute;
            top: calc(100% + 12px);
            right: 0;
            min-width: 260px;
            background: var(--glass-bg-strong);
            backdrop-filter: blur(14px) saturate(150%);
            -webkit-backdrop-filter: blur(14px) saturate(150%);
            border: 1px solid var(--glass-border-soft);
            border-radius: 20px;
            padding: 10px;
            box-shadow: var(--glass-shadow);
            z-index: 1200;
            opacity: 0;
            transform: translateY(-6px) scale(0.96);
            transform-origin: top right;
            pointer-events: none;
            transition: opacity 0.18s ease, transform 0.22s ease;
        }
        .settings-menu.open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .settings-menu-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.5;
            padding: 6px 10px 8px;
        }

        .settings-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 14px;
            cursor: pointer;
            transition: background 0.15s ease;
            color: var(--text-main);
        }
        .settings-item:hover { background: var(--glass-bg); }
        .settings-item-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .settings-item-left svg { width: 18px; height: 18px; flex-shrink: 0; opacity: 0.8; }
        .settings-item-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
        .settings-item-label { font-size: 13px; font-weight: 600; white-space: nowrap; }
        .settings-item-desc {
            font-size: 11px; opacity: 0.55;
            white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; max-width: 160px;
        }

        .toggle {
            position: relative;
            width: 40px; height: 24px;
            border-radius: 20px;
            background: var(--pill-bg);
            border: 1px solid var(--glass-border-soft);
            flex-shrink: 0;
            transition: background 0.22s ease, border-color 0.22s ease;
        }
        .toggle::after {
            content: "";
            position: absolute;
            top: 2px; left: 2px;
            width: 18px; height: 18px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.20);
            transition: transform 0.28s cubic-bezier(0.2, 0.9, 0.3, 1.2);
        }
        .settings-item.on .toggle {
            background: var(--accent);
            border-color: rgba(255,255,255,0.25);
        }
        .settings-item.on .toggle::after { transform: translateX(16px); }

        /* ==========================================================
           MODE RENDIMENT
           ========================================================== */
        body.performance-mode #orb-1,
        body.performance-mode::after { display: none !important; }

        body.performance-mode nav,
        body.performance-mode .nav-center,
        body.performance-mode .nav-link:hover,
        body.performance-mode .category-pill-wrapper,
        body.performance-mode .category-item:hover,
        body.performance-mode .search-container,
        body.performance-mode .search-trigger,
        body.performance-mode .theme-btn,
        body.performance-mode .settings-btn,
        body.performance-mode .settings-menu,
        body.performance-mode .card,
        body.performance-mode .stat-card,
        body.performance-mode .history-section,
        body.performance-mode td,
        body.performance-mode .modal,
        body.performance-mode .modal-content,
        body.performance-mode .game-loader-overlay,
        body.performance-mode .close-modal,
        body.performance-mode .error-container,
        body.performance-mode .reset-btn,
        body.performance-mode .fav-btn,
        body.performance-mode .game-badge {
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
        }

        body.performance-mode {
            --glass-bg: #ffffff;
            --glass-bg-strong: #ffffff;
            --glass-bg-soft: #ffffff;
            --glass-border-soft: rgba(0,0,0,0.08);
            --glass-shadow: 0 2px 8px rgba(15, 20, 40, 0.06);
        }
        body.performance-mode.dark-theme {
            --glass-bg: #14161c;
            --glass-bg-strong: #14161c;
            --glass-bg-soft: #14161c;
            --glass-border-soft: rgba(255,255,255,0.08);
            --glass-shadow: 0 2px 8px rgba(0,0,0,0.40);
        }

        body.performance-mode .card {
            border-radius: 50% !important;
            clip-path: none !important;
            border: 1px solid rgba(0,0,0,0.10);
        }
        body.performance-mode.dark-theme .card {
            border: 1px solid rgba(255,255,255,0.12);
        }
        body.performance-mode .card-wrapper,
        body.performance-mode .card-wrapper:hover,
        body.performance-mode .card-wrapper.favorite-card { filter: none !important; }
        body.performance-mode .card-wrapper.favorite-card .card {
            box-shadow: 0 0 0 3px var(--accent), 0 6px 18px rgba(0, 122, 255, 0.28) !important;
            border-color: transparent;
        }

        /* ==========================================================
           LAYOUT
           ========================================================== */
        .container {
            max-width: 1100px; margin: 0 auto; padding: 90px 24px 100px;
            height: 100vh; overflow-y: auto; position: relative; z-index: 1;
            scrollbar-width: none;
            /* ⚡ OPT #5: aïllament del contenidor scrollable */
            contain: layout;
        }
        .container::-webkit-scrollbar { display: none; }

        .view {
            display: none;
            animation-duration: 0.3s;
            animation-fill-mode: forwards;
            animation-timing-function: cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        .view.active { display: block; }

        @keyframes slideFromRight { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes slideFromLeft { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes slideToRight { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(30px); } }
        @keyframes slideToLeft { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(-30px); } }
        .view.animate-out-left { animation-name: slideToLeft; display: block; }
        .view.animate-out-right { animation-name: slideToRight; display: block; }
        .view.animate-in-left { animation-name: slideFromLeft; display: block; }
        .view.animate-in-right { animation-name: slideFromRight; display: block; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 20px;
        }

        /* ==========================================================
           CARDS — SQUIRCLE
           ⚡ OPT #4, #5, #6: sense drop-shadow, amb content-visibility i contain
           ========================================================== */
        .card-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.3s ease, transform 0.3s ease;
            opacity: 0;
            transform: translateY(10px);

            /* ⚡ OPT #5: només renderitzar quan és a prop del viewport */
            content-visibility: auto;
            contain-intrinsic-size: 140px 180px;

            /* ⚡ OPT #6: aïllament de layout/style */
            contain: layout style;
        }
        .card-wrapper.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ⚡ OPT #4: ombra via pseudo-element, només en hover */
        .card-wrapper::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            aspect-ratio: 1;
            border-radius: 24%;
            box-shadow: 0 16px 32px rgba(15, 20, 40, 0.18);
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
            z-index: -1;
        }
        @supports (clip-path: shape(from 0 0, line to 100% 100%)) {
            .card-wrapper::before {
                --r: 50%;
                --_r: clamp(0%, var(--r) / 2, 25%);
                --_v: calc(var(--_r) * (1 - sqrt(2) / 4));
                --_p: calc(var(--_v) - var(--_r) / 2);
                border-radius: 0;
                clip-path: shape(
                    from var(--_v) var(--_p),
                    curve to 50% 0 with var(--_r) 0,
                    curve to calc(100% - var(--_v)) var(--_p) with calc(100% - var(--_r)) 0,
                    curve to calc(100% - var(--_p)) var(--_v) with calc(100% - 2 * var(--_p)) calc(2 * var(--_p)),
                    curve to 100% 50% with 100% var(--_r),
                    curve to calc(100% - var(--_p)) calc(100% - var(--_v)) with 100% calc(100% - var(--_r)),
                    curve to calc(100% - var(--_v)) calc(100% - var(--_p)) with calc(100% - 2 * var(--_p)) calc(100% - 2 * var(--_p)),
                    curve to 50% 100% with calc(100% - var(--_r)) 100%,
                    curve to var(--_v) calc(100% - var(--_p)) with var(--_r) 100%,
                    curve to var(--_p) calc(100% - var(--_v)) with calc(2 * var(--_p)) calc(100% - 2 * var(--_p)),
                    curve to 0 50% with 0 calc(100% - var(--_r)),
                    curve to var(--_p) var(--_v) with 0 var(--_r),
                    curve to var(--_v) var(--_p) with calc(2 * var(--_p)) calc(2 * var(--_p))
                );
            }
        }
        .card-wrapper:hover::before { opacity: 1; }

        .card-wrapper .card {
            transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.3, 1.15);
        }
        .card-wrapper:hover .card { transform: scale(1.05); }

        /* Favorit: vora blava dins el botó (no filter car) */
        .card-wrapper.favorite-card .fav-btn {
            opacity: 1;
            color: #FFD60A;
            background: rgba(0, 0, 0, 0.55);
        }

        .card {
            position: relative; width: 100%; aspect-ratio: 1;
            background: var(--glass-bg);
            display: flex; align-items: center; justify-content: center;
            /* ⚡ OPT #3: blur reduït per les targetes */
            backdrop-filter: blur(12px) saturate(150%);
            -webkit-backdrop-filter: blur(12px) saturate(150%);
            overflow: hidden;
            border-radius: 24%;
            border: 1px solid var(--glass-border-soft);
        }

        @supports (clip-path: shape(from 0 0, line to 100% 100%)) {
            .card {
                border: none;
                border-radius: 0;
                --r: 50%;
                --_r: clamp(0%, var(--r) / 2, 25%);
                --_v: calc(var(--_r) * (1 - sqrt(2) / 4));
                --_p: calc(var(--_v) - var(--_r) / 2);
                clip-path: shape(
                    from var(--_v) var(--_p),
                    curve to 50% 0 with var(--_r) 0,
                    curve to calc(100% - var(--_v)) var(--_p) with calc(100% - var(--_r)) 0,
                    curve to calc(100% - var(--_p)) var(--_v) with calc(100% - 2 * var(--_p)) calc(2 * var(--_p)),
                    curve to 100% 50% with 100% var(--_r),
                    curve to calc(100% - var(--_p)) calc(100% - var(--_v)) with 100% calc(100% - var(--_r)),
                    curve to calc(100% - var(--_v)) calc(100% - var(--_p)) with calc(100% - 2 * var(--_p)) calc(100% - 2 * var(--_p)),
                    curve to 50% 100% with calc(100% - var(--_r)) 100%,
                    curve to var(--_v) calc(100% - var(--_p)) with var(--_r) 100%,
                    curve to var(--_p) calc(100% - var(--_v)) with calc(2 * var(--_p)) calc(100% - 2 * var(--_p)),
                    curve to 0 50% with 0 calc(100% - var(--_r)),
                    curve to var(--_p) var(--_v) with 0 var(--_r),
                    curve to var(--_v) var(--_p) with calc(2 * var(--_p)) calc(2 * var(--_p))

    <script>
        // ============================================
        // ⚡ OPT #7 + #20: CACHÉ D'ICONES SVG INLINE
        // ============================================
        const ICON_CACHE = {};

        // Extreu i cacheja el SVG de Lucide un sol cop
        function renderIcon(name, opts) {
            opts = opts || {};
            const size = opts.size || 24;
            const className = opts.className || '';
            const style = opts.style || '';
            const fill = opts.fill || '';
            const key = name + '|' + size + '|' + className + '|' + fill;

            if (ICON_CACHE[key]) return ICON_CACHE[key];

            let nodes = null;
            if (typeof lucide !== 'undefined' && lucide.icons) {
                nodes = lucide.icons[name];
                if (!nodes) {
                    const pascal = name.split('-').map(function (s) {
                        return s.charAt(0).toUpperCase() + s.slice(1);
                    }).join('');
                    nodes = lucide.icons[pascal];
                }
            }
            if (!nodes || !Array.isArray(nodes)) return '';

            let parts = '';
            for (let i = 0; i < nodes.length; i++) {
                const node = nodes[i];
                if (!Array.isArray(node) || node.length < 2) continue;
                const tag = node[0];
                const attrs = node[1] || {};
                let attrStr = '';
                for (const k in attrs) {
                    const v = String(attrs[k]).replace(/"/g, '&quot;');
                    attrStr += ' ' + k + '="' + v + '"';
                }
                parts += '<' + tag + attrStr + '/>';
            }

            let svgAttrs = 'xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size +
                '" viewBox="0 0 24 24" fill="' + (fill || 'none') +
                '" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
            if (className) svgAttrs += ' class="' + className + '"';
            if (style) svgAttrs += ' style="' + style + '"';

            const svg = '<svg ' + svgAttrs + '>' + parts + '</svg>';
            ICON_CACHE[key] = svg;
            return svg;
        }

        // ============================================
        // ⚡ OPT #7: substituir lucide.createIcons() per icones inline
        // ============================================
        function replaceDataLucide() {
            // Només un cop a l'inici per les icones estàtiques del nav
            const els = document.querySelectorAll('[data-lucide]');
            for (let i = 0; i < els.length; i++) {
                const el = els[i];
                const name = el.getAttribute('data-lucide');
                const svg = renderIcon(name, {
                    size: parseInt(el.style.width) || 16,
                    className: el.className
                });
                if (svg) el.outerHTML = svg;
            }
        }

        // ============================================
        // ⚡ OPT #1: mode rendiment + settings
        // ============================================
        (function initSettings() {
            const PERF_KEY = 'ulaPerformanceMode';
            const settingsBtn = document.getElementById('settingsBtn');
            const settingsMenu = document.getElementById('settingsMenu');
            const perfModeItem = document.getElementById('perfModeItem');

            let perfEnabled = localStorage.getItem(PERF_KEY) === '1';

            function applyPerfMode(enabled) {
                document.body.classList.toggle('performance-mode', enabled);
                perfModeItem.classList.toggle('on', enabled);
                perfModeItem.setAttribute('aria-checked', String(enabled));
                localStorage.setItem(PERF_KEY, enabled ? '1' : '0');
            }

            applyPerfMode(perfEnabled);

            function openMenu() {
                settingsMenu.classList.add('open');
                settingsBtn.classList.add('active');
                settingsBtn.setAttribute('aria-expanded', 'true');
            }
            function closeMenu() {
                settingsMenu.classList.remove('open');
                settingsBtn.classList.remove('active');
                settingsBtn.setAttribute('aria-expanded', 'false');
            }
            function toggleMenu() {
                if (settingsMenu.classList.contains('open')) closeMenu();
                else openMenu();
            }

            settingsBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                toggleMenu();
            });

            perfModeItem.addEventListener('click', function (e) {
                e.stopPropagation();
                perfEnabled = !perfEnabled;
                applyPerfMode(perfEnabled);
            });
            perfModeItem.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    perfEnabled = !perfEnabled;
                    applyPerfMode(perfEnabled);
                }
            });

            document.addEventListener('click', function (e) {
                if (!settingsMenu.contains(e.target) && !settingsBtn.contains(e.target)) closeMenu();
            });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') closeMenu();
            });
        })();

        // ⚡ OPT #11: NO hi ha JS per la orbe (ara és CSS keyframes)

        // ============================================
        // SERVICE WORKER
        // ============================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(function (reg) { console.log('SW registrat:', reg.scope); })
                    .catch(function (err) { console.error('Error SW:', err); });
            });
        }

        // ============================================
        // CONFIG
        // ============================================
        const LOADER_DURATION = 7000;
        const ALLOWED_CATEGORIES = [
            { id: 'tots', label: 'Tots', icon: 'layout-grid' },
            { id: 'accio', label: 'Acció', icon: 'zap' },
            { id: 'puzle', label: 'Puzle', icon: 'brain' },
            { id: 'esports', label: 'Esports', icon: 'trophy' },
            { id: 'retro', label: 'Retro', icon: 'joystick' },
            { id: 'altres', label: 'Altres', icon: 'more-horizontal' }
        ];

        // ⚡ OPT #19: virtualització lleugera
        const MAX_DOM_CARDS = 150;

        let ALL_GAMES = [];
        let FILTERED_GAMES = [];
        let currentCategory = 'tots';
        let itemsShown = 0;
        const CHUNK_SIZE = 30;

        let favorites = JSON.parse(localStorage.getItem('ulaFavorites')) || [];
        let userStats = JSON.parse(localStorage.getItem('ulaStats')) || {
            plays: 0, points: 0, timeSeconds: 0, streak: 0, lastDate: null, gameHistory: {}
        };

        let loaderTimeout = null;
        let isTransitioning = false;
        let fallbackTimeout = null;

        window.addEventListener('load', function () {
            const pillWrapper = document.getElementById('pillWrapper');
            ALLOWED_CATEGORIES.forEach(function (cat) {
                const item = document.createElement('div');
                item.className = 'category-item' + (cat.id === 'tots' ? ' active' : '');
                item.id = 'cat-' + cat.id;
                item.innerHTML = renderIcon(cat.icon, { size: 13 }) + ' ' + cat.label;
                item.onclick = function () { selectCategory(cat.id); };
                pillWrapper.appendChild(item);
            });

            checkStreak();
            replaceDataLucide();
            setTimeout(updateActivePillPosition, 100);
            updateLogoByTheme();

            document.getElementById('link-arcade').addEventListener('click', function () { navigateToView('arcade', 'right'); });
            document.getElementById('link-stats').addEventListener('click', function () { navigateToView('stats', 'left'); });

            if (typeof GAMES !== 'undefined') {
                ALL_GAMES = GAMES;
                applyFilters();
            }
        });

        function updateLogoByTheme() {
            const isDark = document.body.classList.contains('dark-theme');
            const logoSrc = isDark ? 'assets/icons/icon-large-dark.png' : 'assets/icons/icon-large-light.png';
            const logoImg = document.getElementById('logoImg');
            if (logoImg) logoImg.src = logoSrc;
        }

        function checkStreak() {
            const today = new Date().toDateString();
            if (userStats.lastDate) {
                const last = new Date(userStats.lastDate);
                const yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);
                if (last.toDateString() === yesterday.toDateString()) {
                    if (userStats.lastDate !== today) userStats.streak = (userStats.streak || 0) + 1;
                } else if (last.toDateString() !== today) userStats.streak = 1;
            } else userStats.streak = 1;
            userStats.lastDate = today;
            saveStats();
        }

        function saveStats() { localStorage.setItem('ulaStats', JSON.stringify(userStats)); }

        function selectCategory(catId) {
