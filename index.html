<!DOCTYPE html>
<html lang="ca">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="theme-color" content="#007AFF">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Meta tags per a PWA -->
    <meta name="application-name" content="ulaGames">
    <meta name="apple-mobile-web-app-title" content="ulaGames">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Icones per a iOS -->
    <link rel="apple-touch-icon" href="icons/icon-pla">
    <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-pla.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-pla.png">
    <link rel="apple-touch-icon" sizes="167x167" href="icons/icon-pla.png">

    <!-- Safari pinned tab icon -->
    <link rel="mask-icon" href="icons/safari-pinned-tab.svg" color="#007AFF">

    <!-- Theme color per a diferents navegadors -->
    <meta name="theme-color" content="#007AFF" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="msapplication-TileColor" content="#007AFF">
    <meta name="msapplication-config" content="browserconfig.xml">

    <!-- Per a iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Per a Android -->
    <meta name="mobile-web-app-capable" content="yes">
    <title>Inici | ulaGames</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="icons/favicon.png">
    <!-- Estils propis -->
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/skeleton.css">
</head>
<body>
    <div id="loadingOverlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 9999; display: flex; justify-content: center; align-items: center; transition: opacity 0.5s ease;">
        <video src="assets/videos/loading.mp4" autoplay loop muted playsinline style="width: 200px; height: auto; border-radius: 10px;"></video>
    </div>

    <script>
        (function() {
            const overlay = document.getElementById('loadingOverlay');
            const savedTheme = localStorage.getItem('ula-theme');
            const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            // Apliquem el color de fons immediatament segons el tema guardat
            if (savedTheme === 'dark' || (!savedTheme && systemDark)) {
                overlay.style.background = '#000000';
            } else {
                overlay.style.background = '#ffffff';
            }

            // Generem un temps aleatori entre 4000ms (4s) i 12000ms (12s)
            const randomTime = Math.floor(Math.random() * (12000 - 4000 + 1)) + 2000;

            window.addEventListener('load', () => {
                setTimeout(() => {
                    overlay.style.opacity = '0';
                    setTimeout(() => overlay.remove(), 500);
                }, randomTime);
            });
        })();
    </script>

    <!-- Fons i Aura Global -->
    <div class="ambient-bg"><div class="blob"></div></div>
    <div id="cursorAura" class="cursor-aura"></div>

    <nav>
        <div class="nav-left">
            <div class="logo-box">
                <i class="fa-solid fa-bars"></i>
                <span>unlockedGames</span>
            </div>
            <div class="dropdown-menu">
                <a href="index.html" class="menu-link"><i class="fa-solid fa-arrow-rotate-right"></i> Actualitzar Pàgina</a>
                <a href="stats.html" class="menu-link"><i class="fa-solid fa-chart-line"></i> Estadístiques</a>
                <a href="javascript:void(0)" onclick="togglePerformanceMode()" class="menu-link">
                    <i class="fa-solid fa-gauge-high"></i> <span id="performanceModeText">Mode de rendiment: OFF</span>
                </a>
            </div>
        </div>

        <div class="search-wrapper">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Cerca el teu proper joc...">
        </div>

        <div style="font-weight: 600; font-size: 13px; color: var(--text-muted);">v2.6.7 (beta)</div>

        <!-- Theme Toggle -->
        <div class="theme-toggle-container">
            <button class="theme-toggle" id="themeToggle" aria-label="Canviar tema">
                <div class="theme-toggle-track">
                    <div class="theme-toggle-sun">
                        <svg viewBox="0 0 24 24">
                            <path></path>
                        </svg>
                    </div>
                    <div class="theme-toggle-moon">
                        <svg viewBox="0 0 24 24">
                            <path></path>
                        </svg>
                    </div>
                    <div class="theme-toggle-thumb"></div>
                </div>
            </button>
        </div>
    </nav>

    <div class="container">
        <!-- El grid es generarà via JS -->
        <div class="grid" id="gamesGrid"></div>
    </div>

    <!-- Modal del Joc -->
    <div id="gameModal" class="modal">
        <div class="modal-content">
            <div class="close-btn" onclick="GameCore.close()"><i class="fa-solid fa-xmark"></i></div>
            <iframe id="gameIframe" src="" frameborder="0" style="width:100%; height:100%;"></iframe>
        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/gameList.js"></script>
    <script src="assets/js/scripts.js"></script>
</body>
</html>
