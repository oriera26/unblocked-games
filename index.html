<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ulaGames - El teu Arcade</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --glow-color-rgb: 0, 122, 255;
            --text-main: #1d1d1f;
            --accent: #007AFF;
            --bg-base: #fbfbfd;
            --glass-bg: rgba(255, 255, 255, 0.4); 
            --glass-border: rgba(0, 0, 0, 0.08);
            --pill-bg: rgba(0, 0, 0, 0.03);
            --table-hover: rgba(0, 0, 0, 0.02);
            --nav-blur: 20px;
            --fire-color: #ff4d00;
        }

        .dark-theme {
            --glow-color-rgb: 10, 132, 255;
            --text-main: #f5f5f7;
            --accent: #0A84FF;
            --bg-base: #000000;
            --glass-bg: rgba(20, 20, 20, 0.5);
            --glass-border: rgba(255, 255, 255, 0.12);
            --pill-bg: rgba(255, 255, 255, 0.08);
            --table-hover: rgba(255, 255, 255, 0.05);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            overflow: hidden;
            transition: background 0.4s ease;
        }

        #ambient-canvas {
            position: fixed; inset: 0; z-index: -1;
            pointer-events: none;
        }

        /* Nav Principal (Superior) */
        nav {
            position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 30px); max-width: 900px; height: 54px;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--nav-blur)) saturate(180%);
            -webkit-backdrop-filter: blur(var(--nav-blur)) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 27px; z-index: 1000;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.05);
        }

        .nav-left, .nav-right { display: flex; align-items: center; gap: 15px; }
        .logo { font-weight: 800; font-size: 16px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .logo i { color: var(--accent); width: 18px; }

        .nav-links { display: flex; gap: 15px; }
        .nav-link { font-size: 13px; font-weight: 600; opacity: 0.5; transition: 0.2s; cursor: pointer; }
        .nav-link:hover, .nav-link.active { opacity: 1; color: var(--accent); }

        /* Categorització: Barra Inferior Central (Compacta) */
        .category-container {
            position: fixed; 
            bottom: 25px; 
            left: 50%; 
            transform: translateX(-50%);
            z-index: 1000; 
            width: auto; 
            max-width: 95vw;
        }

        .category-pill-wrapper {
            position: relative;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--nav-blur)) saturate(180%);
            -webkit-backdrop-filter: blur(var(--nav-blur)) saturate(180%);
            padding: 4px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            display: flex;
            gap: 2px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            overflow-x: auto;
            scrollbar-width: none;
        }
        .category-pill-wrapper::-webkit-scrollbar { display: none; }

        .category-item {
            position: relative;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text-main);
            opacity: 0.5;
            z-index: 2;
        }

        .category-item i { width: 13px; height: 13px; }
        .category-item.active { opacity: 1; color: #fff; }

        .category-active-bg {
            position: absolute;
            top: 4px;
            left: 4px;
            height: calc(100% - 8px);
            background: var(--accent);
            border-radius: 16px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 10px rgba(var(--glow-color-rgb), 0.25);
            z-index: 1;
            pointer-events: none;
        }

        /* Search */
        .search-container { display: flex; align-items: center; position: relative; }
        .search-bar {
            width: 0; opacity: 0; padding: 6px 0; background: transparent;
            border: none; border-bottom: 1.5px solid var(--accent);
            color: var(--text-main); font-size: 13px; outline: none;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }
        .search-container:hover .search-bar, .search-bar:focus {
            width: 140px; opacity: 1; padding: 6px 8px; margin-right: 8px; pointer-events: all;
        }
        .search-trigger { background: none; border: none; color: var(--text-main); opacity: 0.7; cursor: pointer; }

        /* Layout */
        .container { 
            max-width: 1100px; margin: 0 auto; padding: 90px 24px 100px; 
            height: 100vh; overflow-y: auto; position: relative; z-index: 1;
            scrollbar-width: none;
        }
        .container::-webkit-scrollbar { display: none; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 20px; }
        
        /* Cards */
        .card-wrapper { position: relative; display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: 0.3s; opacity: 0; transform: translateY(10px); }
        .card-wrapper.visible { opacity: 1; transform: translateY(0); }

        .card {
            position: relative; width: 100%; aspect-ratio: 1;
            background: var(--glass-bg); border-radius: 22%;
            border: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(10px) brightness(1.1);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }
        .card img { width: 100%; height: 100%; object-fit: cover; transition: 0.4s; }
        .card i.game-icon { width: 40px; height: 40px; stroke-width: 1.2; color: var(--text-main); opacity: 0.3; position: absolute; }
        
        .fav-btn {
            position: absolute; top: 8px; right: 8px; z-index: 10;
            background: rgba(0,0,0,0.3); backdrop-filter: blur(5px);
            border: none; color: white; width: 28px; height: 28px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: 0.3s; cursor: pointer;
        }
        .card-wrapper:hover .fav-btn, .fav-btn.active { opacity: 1; }
        .fav-btn.active { color: #FFD60A; background: rgba(0,0,0,0.5); }

        .card:hover { transform: scale(1.05) translateY(-5px); border: 1px solid rgba(var(--glow-color-rgb), 0.5); box-shadow: 0 15px 30px rgba(0,0,0,0.15); }
        .card-title { margin-top: 10px; font-size: 11px; font-weight: 600; opacity: 0.8; text-align: center; max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Stats & History */
        .stats-header { margin-bottom: 25px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 30px; }
        .stat-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            padding: 20px; border-radius: 24px; backdrop-filter: blur(40px);
            display: flex; flex-direction: column; gap: 8px;
            position: relative; overflow: hidden;
        }
        .stat-value { font-size: 28px; font-weight: 800; color: var(--accent); display: flex; align-items: center; gap: 8px; }
        .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.6; font-weight: 700; }
        
        /* Animació flama */
        .streak-flame {
            color: var(--fire-color);
            filter: drop-shadow(0 0 8px rgba(255, 77, 0, 0.6));
            animation: flamePulse 1.5s infinite alternate ease-in-out;
        }
        @keyframes flamePulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        /* Taula detallada */
        .history-section {
            background: var(--glass-bg); 
            padding: 24px; 
            border-radius: 28px; 
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(40px);
        }
        .table-container { overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        th { text-align: left; padding: 12px; font-size: 11px; text-transform: uppercase; opacity: 0.4; letter-spacing: 0.5px; }
        td { padding: 14px 12px; background: var(--table-hover); font-size: 14px; }
        td:first-child { border-radius: 12px 0 0 12px; font-weight: 600; }
        td:last-child { border-radius: 0 12px 12px 0; text-align: right; opacity: 0.6; font-size: 12px; }
        .game-badge { background: var(--accent); color: white; padding: 2px 8px; border-radius: 6px; font-size: 10px; margin-left: 8px; vertical-align: middle; }

        /* Modal */
        .modal {
            position: fixed; inset: 0; z-index: 2000;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(30px);
            display: none; align-items: center; justify-content: center; padding: 15px;
        }
        .modal.active { display: flex; }
        .modal-content {
            width: 100%; height: 100%; max-width: 1200px; max-height: 88vh;
            background: #000; border-radius: 24px; overflow: hidden;
            position: relative; border: 1px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column;
        }
        .close-modal {
            position: absolute; top: 12px; right: 12px; width: 32px; height: 32px;
            background: rgba(255,255,255,0.2); border-radius: 50%; border: none;
            color: white; display: flex; align-items: center; justify-content: center;
            z-index: 2100; cursor: pointer;
        }
        #gameIframe { flex: 1; width: 100%; height: 100%; border: none; }

        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .theme-btn { background: none; border: none; color: var(--text-main); opacity: 0.7; cursor: pointer; }
        
        /* 404 */
        .error-container { padding-top: 80px; text-align: center; }
        .reset-btn { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 12px; margin-top: 20px; cursor: pointer; font-weight: 600; }
    </style>
</head>
<body class="dark-theme">

    <canvas id="ambient-canvas"></canvas>

    <nav>
        <div class="nav-left">
            <div class="logo" onclick="showView('arcade')">
                <i data-lucide="layers"></i>
                <span>ulaGames</span>
            </div>
            <div class="nav-links">
                <span class="nav-link active" id="link-arcade" onclick="showView('arcade')">Arcade</span>
                <span class="nav-link" id="link-stats" onclick="showView('stats')">Perfil</span>
            </div>
        </div>
        
        <div class="nav-right">
            <div class="search-container">
                <input type="text" class="search-bar" placeholder="Cerca un joc..." id="gameSearch">
                <button class="search-trigger"><i data-lucide="search" style="width:18px;"></i></button>
            </div>
            <button class="theme-btn" id="themeBtn"><i data-lucide="sun" id="themeIcon" style="width:18px;"></i></button>
        </div>
    </nav>

    <div class="container" id="scrollContainer">
        <!-- VISTA ARCADE -->
        <section id="view-arcade" class="view active">
            <div class="grid" id="gameGrid"></div>
            <div id="loadMoreTrigger" style="height: 60px;"></div>
        </section>

        <!-- VISTA STATS -->
        <section id="view-stats" class="view">
            <div class="stats-header">
                <h1 style="font-size: 32px; font-weight: 800; letter-spacing: -0.5px;">El teu Perfil</h1>
                <p style="opacity: 0.5; font-size: 15px;">Dades d'activitat i fites assolides.</p>
            </div>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Ratxa Actual</div>
                    <div class="stat-value">
                        <span id="stat-streak">0</span>
                        <i data-lucide="flame" class="streak-flame"></i>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Puntuació Total</div>
                    <div class="stat-value" id="stat-points">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Nivell</div>
                    <div class="stat-value" id="stat-level">Bronce</div>
                    <div style="width: 100%; height: 4px; background: var(--pill-bg); border-radius: 2px; margin-top: 4px;">
                        <div id="level-progress" style="width: 30%; height: 100%; background: var(--accent); border-radius: 2px;"></div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Temps Jugat</div>
                    <div class="stat-value" id="stat-time">0m</div>
                </div>
            </div>

            <div class="history-section">
                <div style="font-weight: 700; font-size: 18px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
                    <i data-lucide="activity" style="width:20px; color: var(--accent);"></i> Historial Detallat de Jocs
                </div>
                <div class="table-container">
                    <table id="historyTable">
                        <thead>
                            <tr>
                                <th>Joc</th>
                                <th style="text-align: center;">Partides</th>
                                <th style="text-align: center;">Temps</th>
                                <th style="text-align: right;">Última sessió</th>
                            </tr>
                        </thead>
                        <tbody id="historyBody"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- VISTA 404 -->
        <section id="view-404" class="view">
            <div class="error-container">
                <i data-lucide="frown" style="width: 48px; height: 48px; opacity: 0.3;"></i>
                <h2 style="margin-top:15px; opacity: 0.8;">Sense resultats</h2>
                <button class="reset-btn" onclick="resetFilters()">Neteja la cerca</button>
            </div>
        </section>
    </div>

    <!-- Barra de Categories Inferior -->
    <div class="category-container" id="categoryContainer">
        <div class="category-pill-wrapper" id="pillWrapper">
            <div class="category-active-bg" id="activePill"></div>
        </div>
    </div>

    <div id="gameModal" class="modal">
        <div class="modal-content">
            <button class="close-modal" id="closeModal"><i data-lucide="x"></i></button>
            <iframe id="gameIframe" src="" allow="autoplay; fullscreen; keyboard; gamepad"></iframe>
        </div>
    </div>

    <script src="assets/js/gameList.js"></script>

    <script>
        const ALLOWED_CATEGORIES = [
            { id: 'tots', label: 'Tots', icon: 'layout-grid' },
            { id: 'accio', label: 'Acció', icon: 'zap' },
            { id: 'puzle', label: 'Puzle', icon: 'brain' },
            { id: 'esports', label: 'Esports', icon: 'trophy' },
            { id: 'retro', label: 'Retro', icon: 'joystick' },
            { id: 'altres', label: 'Altres', icon: 'more-horizontal' }
        ];

        let ALL_GAMES = [];
        let FILTERED_GAMES = [];
        let currentCategory = 'tots';
        let itemsShown = 0;
        const CHUNK_SIZE = 30;

        let favorites = JSON.parse(localStorage.getItem('ulaFavorites')) || [];
        let userStats = JSON.parse(localStorage.getItem('ulaStats')) || { 
            plays: 0, 
            points: 0, 
            timeSeconds: 0, 
            streak: 0, 
            lastDate: null, 
            gameHistory: {} 
        };

        window.addEventListener('load', () => {
            const pillWrapper = document.getElementById('pillWrapper');
            ALLOWED_CATEGORIES.forEach(cat => {
                const item = document.createElement('div');
                item.className = `category-item ${cat.id === 'tots' ? 'active' : ''}`;
                item.id = `cat-${cat.id}`;
                item.innerHTML = `<i data-lucide="${cat.icon}"></i> ${cat.label}`;
                item.onclick = () => selectCategory(cat.id);
                pillWrapper.appendChild(item);
            });
            
            checkStreak();
            lucide.createIcons();
            setTimeout(updateActivePillPosition, 100);

            if (typeof GAMES !== 'undefined') {
                ALL_GAMES = GAMES;
                applyFilters();
            }
        });

        function checkStreak() {
            const today = new Date().toDateString();
            if (userStats.lastDate) {
                const last = new Date(userStats.lastDate);
                const yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);

                if (last.toDateString() === yesterday.toDateString()) {
                    if (userStats.lastDate !== today) {
                        userStats.streak++;
                    }
                } else if (last.toDateString() !== today) {
                    userStats.streak = 1;
                }
            } else {
                userStats.streak = 1;
            }
            userStats.lastDate = today;
            saveStats();
        }

        function selectCategory(catId) {
            currentCategory = catId;
            document.querySelectorAll('.category-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`cat-${catId}`).classList.add('active');
            updateActivePillPosition();
            applyFilters();
        }

        function updateActivePillPosition() {
            const activeEl = document.querySelector('.category-item.active');
            const pill = document.getElementById('activePill');
            if (activeEl && pill) {
                pill.style.width = `${activeEl.offsetWidth}px`;
                pill.style.left = `${activeEl.offsetLeft}px`;
            }
        }

        function applyFilters() {
            const searchTerm = document.getElementById('gameSearch').value.toLowerCase();
            FILTERED_GAMES = ALL_GAMES.filter(g => {
                const matchesSearch = g.name.toLowerCase().includes(searchTerm);
                const matchesCat = currentCategory === 'tots' || (g.type && g.type.toLowerCase() === currentCategory);
                return matchesSearch && matchesCat;
            });
            if (FILTERED_GAMES.length === 0) showView('404');
            else { showView('arcade'); renderInitial(); }
        }

        function resetFilters() {
            document.getElementById('gameSearch').value = "";
            selectCategory('tots');
        }

        const grid = document.getElementById('gameGrid');
        const scrollContainer = document.getElementById('scrollContainer');
        const trigger = document.getElementById('loadMoreTrigger');

        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && itemsShown < FILTERED_GAMES.length) loadMore();
        }, { root: scrollContainer, threshold: 0.1 });
        observer.observe(trigger);

        function renderInitial() { grid.innerHTML = ""; itemsShown = 0; loadMore(); }

        function loadMore() {
            const nextBatch = FILTERED_GAMES.slice(itemsShown, itemsShown + CHUNK_SIZE);
            nextBatch.forEach((g, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'card-wrapper';
                wrapper.onclick = () => launchGame(g);
                const isFav = favorites.includes(g.id || g.url);
                const mediaContent = g.image ? `<img src="${g.image}" loading="lazy" onerror="this.style.display='none';">` : "";
                wrapper.innerHTML = `
                    <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite(event, '${g.id || g.url}')">
                        <i data-lucide="star" style="${isFav ? 'fill: #FFD60A' : ''}"></i>
                    </button>
                    <div class="card">${mediaContent}<i data-lucide="gamepad-2" class="game-icon"></i></div>
                    <div class="card-title">${g.name}</div>
                `;
                grid.appendChild(wrapper);
                setTimeout(() => wrapper.classList.add('visible'), index * 20);
            });
            itemsShown += nextBatch.length;
            lucide.createIcons();
        }

        function showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            document.getElementById(`view-${viewId}`).classList.add('active');
            document.getElementById(`link-${viewId}`)?.classList.add('active');
            const catContainer = document.getElementById('categoryContainer');
            if (viewId === 'arcade' || viewId === '404') {
                catContainer.style.display = 'block';
                setTimeout(updateActivePillPosition, 50);
            } else catContainer.style.display = 'none';
            if(viewId === 'stats') updateStatsUI();
        }

        function toggleFavorite(e, id) {
            e.stopPropagation();
            const idx = favorites.indexOf(id);
            if(idx > -1) favorites.splice(idx, 1);
            else favorites.push(id);
            localStorage.setItem('ulaFavorites', JSON.stringify(favorites));
            e.currentTarget.classList.toggle('active');
            lucide.createIcons();
        }

        const canvas = document.getElementById('ambient-canvas');
        const ctx = canvas.getContext('2d');
        let mX = 0, mY = 0;
        window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
        window.onresize();
        document.addEventListener('mousemove', e => { mX = e.clientX; mY = e.clientY; });

        function draw() {
            const isDark = document.body.classList.contains('dark-theme');
            ctx.fillStyle = isDark ? '#000' : '#fbfbfd';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            const grad = ctx.createRadialGradient(mX, mY, 0, mX, mY, 600);
            grad.addColorStop(0, isDark ? 'rgba(10,132,255,0.15)' : 'rgba(0,122,255,0.08)');
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);
            requestAnimationFrame(draw);
        }
        draw();

        document.getElementById('themeBtn').onclick = () => {
            const isDark = document.body.classList.toggle('dark-theme');
            document.getElementById('themeIcon').setAttribute('data-lucide', isDark ? 'sun' : 'moon');
            lucide.createIcons();
        };

        let sessionStart = null;
        let currentGame = null;

        function launchGame(game) {
            currentGame = game;
            sessionStart = Date.now();
            const iframe = document.getElementById('gameIframe');
            iframe.src = `assets/games/${game.url.endsWith('.html') ? game.url : game.url + '.html'}`;
            document.getElementById('gameModal').classList.add('active');
            userStats.plays = (userStats.plays || 0) + 1;
            userStats.points = (userStats.points || 0) + 15; // Més punts per cada partida
            saveStats();
        }

        document.getElementById('closeModal').onclick = () => {
            // Dins de l'event del botó closeModal
            if (sTime && cGame) {
                const d = Math.floor((Date.now() - sTime) / 1000);
                userStats.timeSeconds = (userStats.timeSeconds || 0) + d;
                
                // Inicialització segura de l'historial del joc
                if (!userStats.gameHistory) userStats.gameHistory = {};
                if (!userStats.gameHistory[cGame.name]) {
                    userStats.gameHistory[cGame.name] = { count: 0, timePlayed: 0, last: "" };
                }
                
                // Increment segur (fent servir || 0 per evitar el NaN)
                userStats.gameHistory[cGame.name].count = (userStats.gameHistory[cGame.name].count || 0) + 1;
                userStats.gameHistory[cGame.name].timePlayed = (userStats.gameHistory[cGame.name].timePlayed || 0) + d;
                userStats.gameHistory[cGame.name].last = new Date().toISOString();
                
                save();
            }
            document.getElementById('gameModal').classList.remove('active');
            document.getElementById('gameIframe').src = "";
        };

        function saveStats() { localStorage.setItem('ulaStats', JSON.stringify(userStats)); }
        
        function updateStatsUI() {
            
            document.getElementById('stat-streak').innerText = userStats.streak || 0;
            document.getElementById('stat-points').innerText = userStats.points || 0;
            document.getElementById('stat-time').innerText = Math.floor((userStats.timeSeconds || 0) / 60) + 'm';

            // Nivells
            
            const points = userStats.points || 0;
            const levelEl = document.getElementById('stat-level');
            const progressEl = document.getElementById('level-progress');
            let level = "Novell"; let progress = (points % 500) / 500 * 100;
            if(points > 2000) level = "Llegenda";
            else if(points > 1000) level = "Expert";
            else if(points > 500) level = "Pro";
            else if(points > 100) level = "Aficionat";
            levelEl.innerText = level;
            progressEl.style.width = `${progress}%`;

            const historyBody = document.getElementById('historyBody');
            const history = userStats.gameHistory || {};
            const sorted = Object.keys(history).sort((a,b) => new Date(history[b].lastPlayed) - new Date(history[a].lastPlayed));
            
            if(sorted.length === 0) {
                historyBody.innerHTML = '<tr><td colspan="4" style="opacity:0.5; padding:40px; text-align:center">Encara no has jugat a cap joc. Comença la teva aventura!</td></tr>';
            } else {
                historyBody.innerHTML = sorted.map(name => {
                    const g = h[k];
                    const totalSeconds = g.timePlayed || 0; // Força el 0 si és NaN
                    const m = Math.floor(totalSeconds / 60);
                    const s = totalSeconds % 60;
                    const count = g.count || 0; // Força el 0 si és NaN
                    const date = new Date(g.lastPlayed).toLocaleDateString('ca-ES', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
                    return `
                        <tr>
                            <td>${name}</td>
                            <td style="text-align: center;"><span class="game-badge">${g.count}</span></td>
                            <td style="text-align: center;">${mins}m ${secs}s</td>
                            <td>${date}</td>
                        </tr>
                    `;
                }).join('');
            }
        }

        document.getElementById('gameSearch').oninput = applyFilters;
    </script>
</body>
