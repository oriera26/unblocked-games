<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>UnblockedGames by Ula</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="icon" type="image/x-icon" href="assets/icons/icon.ico">

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#007AFF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">

    <style>
        :root {
            --glow-color-rgb: 0, 122, 255;
            --text-main: #1d1d1f;
            --accent: #007AFF;
            --bg-base: #fbfbfd;
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(0, 0, 0, 0.08);
            --pill-bg: rgba(0, 0, 0, 0.03);
            --table-hover: rgba(0, 0, 0, 0.02);
            --nav-blur: 20px;
            --fire-color: #ff4d00;
            --fav-glow: rgba(255, 214, 10, 0.3);
        }

        .dark-theme {
            --glow-color-rgb: 10, 132, 255;
            --text-main: #f5f5f7;
            --accent: #0A84FF;
            --bg-base: #000000;
            --glass-bg: rgba(20, 20, 20, 0.5);
            --glass-border: rgba(255, 255, 255, 0.12);
            --pill-bg: rgba(255, 255, 255, 0.08);
            --table-hover: rgba(255, 255, 255, 0.05);
            --fav-glow: rgba(255, 214, 10, 0.2);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            transition: background 0.4s ease;
        }

        /* NAV PRINCIPAL */
        nav {
            position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 30px); max-width: 900px; height: 56px;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--nav-blur)) saturate(180%);
            -webkit-backdrop-filter: blur(var(--nav-blur)) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 28px; z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.05);
        }

        .nav-left, .nav-right, .nav-center { z-index: 1; }
        .nav-left, .nav-right { display: flex; align-items: center; gap: 15px; }
        
        .nav-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(128, 128, 128, 0.1);
            padding: 4px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
        }
        .nav-link {
            font-size: 14px;
            font-weight: 600;
            padding: 6px 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.23, 1, 0.32, 1);
            color: var(--text-main);
            background: transparent;
            text-align: center;
        }
        .nav-link:hover {
            background: rgba(255,255,255,0.15);
            transform: scale(0.98);
        }
        .nav-link.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 2px 8px rgba(var(--glow-color-rgb), 0.3);
        }

        .logo { 
            font-weight: 800; 
            font-size: 16px; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            cursor: pointer;
            line-height: 0;
        }
        .logo-img {
            height: 34px;
            width: auto;
            transform: scaleX(1.03);
            transform-origin: left center;
            transition: transform 0.2s ease;
            object-fit: contain;
            display: block;
        }
        .logo:hover .logo-img {
            transform: scaleX(1.05);
        }

        /* CATEGORIES */
        .category-container {
            position: fixed; 
            bottom: 25px; 
            left: 50%; 
            transform: translateX(-50%);
            z-index: 1000; 
            width: auto; 
            max-width: 95vw;
        }

        .category-pill-wrapper {
            position: relative;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--nav-blur)) saturate(180%);
            -webkit-backdrop-filter: blur(var(--nav-blur)) saturate(180%);
            padding: 4px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            display: flex;
            gap: 2px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            overflow-x: auto;
            scrollbar-width: none;
        }

        .category-item {
            position: relative;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text-main);
            opacity: 0.5;
            z-index: 2;
        }

        .category-item i { width: 13px; height: 13px; }
        .category-item.active { opacity: 1; color: #fff; }

        .category-active-bg {
            position: absolute;
            top: 4px;
            left: 4px;
            height: calc(100% - 8px);
            background: var(--accent);
            border-radius: 16px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 10px rgba(var(--glow-color-rgb), 0.25);
            z-index: 1;
            pointer-events: none;
        }

        /* SEARCH */
        .search-container { display: flex; align-items: center; position: relative; }
        .search-bar {
            width: 0; opacity: 0; padding: 6px 0; background: transparent;
            border: none; border-bottom: 1.5px solid var(--accent);
            color: var(--text-main); font-size: 13px; outline: none;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }
        .search-container:hover .search-bar, .search-bar:focus {
            width: 140px; opacity: 1; padding: 6px 8px; margin-right: 8px; pointer-events: all;
        }
        .search-trigger { background: none; border: none; color: var(--text-main); opacity: 0.7; cursor: pointer; }

        /* LAYOUT */
        .container { 
            max-width: 1100px; margin: 0 auto; padding: 90px 24px 100px; 
            height: 100vh; overflow-y: auto; position: relative; z-index: 1;
            scrollbar-width: none;
        }
        .container::-webkit-scrollbar { display: none; }

        /* TRANSICIONS */
        .view {
            display: none;
            animation-duration: 0.35s;
            animation-fill-mode: forwards;
            animation-timing-function: cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        .view.active { display: block; }

        @keyframes slideFromRight {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideFromLeft {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideToRight {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(30px); }
        }
        @keyframes slideToLeft {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(-30px); }
        }
        .view.animate-out-left { animation-name: slideToLeft; animation-duration: 0.3s; display: block; }
        .view.animate-out-right { animation-name: slideToRight; animation-duration: 0.3s; display: block; }
        .view.animate-in-left { animation-name: slideFromLeft; display: block; }
        .view.animate-in-right { animation-name: slideFromRight; display: block; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 20px; }

        /* CARDS */
        .card-wrapper { 
            position: relative; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            cursor: pointer; 
            transition: transform 0.2s ease, opacity 0.3s ease; 
            opacity: 0; 
            transform: translateY(10px);
        }
        .card-wrapper.visible { opacity: 1; transform: translateY(0); }

        .card-wrapper.favorite-card .card {
            transform: scale(1.02);
            box-shadow: 0 0 0 2px var(--accent), 0 8px 20px rgba(0,0,0,0.1);
        }
        .card-wrapper .card { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .card-wrapper .card:hover { transform: scale(1.05); }

        .card {
            position: relative; width: 100%; aspect-ratio: 1;
            background: var(--glass-bg);
            border-radius: 22%;
            border: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(10px) brightness(1.1);
            -webkit-backdrop-filter: blur(10px) brightness(1.1);
            overflow: hidden;
        }
        .card img { width: 100%; height: 100%; object-fit: cover; transition: 0.4s; }
        .card i.game-icon { width: 40px; height: 40px; stroke-width: 1.2; color: var(--text-main); opacity: 0.3; position: absolute; }

        /* Fav btn */
        .fav-btn {
            position: absolute;
            top: 10px; right: 10px; z-index: 15;
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(8px);
            border: none; color: rgba(255, 255, 255, 0.9);
            width: 32px; height: 32px; border-radius: 30px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: background 0.2s, color 0.2s, opacity 0.2s;
            opacity: 0; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .card-wrapper:hover .fav-btn { opacity: 1; }
        .fav-btn.active { opacity: 1; color: #FFD60A; background: rgba(0, 0, 0, 0.6); }
        .fav-btn:hover { background: rgba(0, 0, 0, 0.8); color: #FFD60A; }
        .fav-btn i { width: 18px; height: 18px; stroke-width: 1.5; }

        .card-title { margin-top: 10px; font-size: 11px; font-weight: 600; opacity: 0.8; text-align: center; max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* ESTADÍSTIQUES */
        .stats-header { margin-bottom: 25px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 30px; }
        .stat-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            padding: 20px; border-radius: 24px; backdrop-filter: blur(40px);
            display: flex; flex-direction: column; gap: 8px;
            position: relative; overflow: hidden;
        }
        .stat-value { font-size: 28px; font-weight: 800; color: var(--accent); display: flex; align-items: center; gap: 8px; }
        .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.6; font-weight: 700; }
        
        .streak-flame {
            color: var(--fire-color);
            filter: drop-shadow(0 0 8px rgba(255, 77, 0, 0.6));
            animation: flamePulse 1.5s infinite alternate ease-in-out;
        }
        @keyframes flamePulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        .history-section {
            background: var(--glass-bg); 
            padding: 24px; 
            border-radius: 28px; 
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(40px);
        }
        .table-container { overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        th { text-align: left; padding: 12px; font-size: 11px; text-transform: uppercase; opacity: 0.4; letter-spacing: 0.5px; }
        td { padding: 14px 12px; background: var(--table-hover); font-size: 14px; }
        td:first-child { border-radius: 12px 0 0 12px; font-weight: 600; }
        td:last-child { border-radius: 0 12px 12px 0; text-align: right; opacity: 0.6; font-size: 12px; }
        .game-badge { background: var(--accent); color: white; padding: 2px 8px; border-radius: 6px; font-size: 10px; margin-left: 8px; vertical-align: middle; }

        /* MODAL */
        .modal {
            position: fixed; inset: 0; z-index: 2000;
            background: var(--bg-base);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .modal.active { display: flex; }
        .modal-content {
            width: 100%; height: 100%; max-width: 1200px; max-height: 88vh;
            background: transparent;
            border-radius: 28px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .close-modal {
            position: absolute; top: 16px; right: 16px;
            width: 40px; height: 40px;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px);
            border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.25);
            color: white; display: flex; align-items: center; justify-content: center;
            z-index: 2150; cursor: pointer; transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .close-modal:hover { background: rgba(0, 0, 0, 0.8); transform: scale(1.05); }
        .close-modal i { width: 20px; height: 20px; stroke-width: 2; }
        #gameIframe { flex: 1; width: 100%; height: 100%; border: none; background: #000; }

        .game-loader-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-base); display: flex; align-items: center; justify-content: center;
            z-index: 2100; transition: opacity 0.5s ease; pointer-events: none;
            border-radius: 28px;
        }
        .spinner { width: 48px; height: 48px; border: 3px solid rgba(128, 128, 128, 0.2); border-top-color: var(--text-main); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .theme-btn { background: none; border: none; color: var(--text-main); opacity: 0.7; cursor: pointer; }

        .error-container { padding-top: 80px; text-align: center; }
        .reset-btn { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 12px; margin-top: 20px; cursor: pointer; font-weight: 600; }
    </style>
</head>
<body class="dark-theme">

    <nav>
        <div class="nav-left">
            <div class="logo" onclick="navigateToView('arcade', 'left')">
                <img id="logoImg" class="logo-img" src="assets/icons/icon-large-dark.png" alt="ulaGames">
            </div>
        </div>
        <div class="nav-center">
            <span class="nav-link active" id="link-arcade" data-view="arcade">Jocs</span>
            <span class="nav-link" id="link-stats" data-view="stats">Estadístiques</span>
        </div>
        <div class="nav-right">
            <div class="search-container">
                <input type="text" class="search-bar" placeholder="Cerca un joc..." id="gameSearch">
                <button class="search-trigger"><i data-lucide="search" style="width:18px;"></i></button>
            </div>
            <button class="theme-btn" id="themeBtn"><i data-lucide="sun" id="themeIcon" style="width:18px;"></i></button>
        </div>
    </nav>

    <div class="container" id="scrollContainer">
        <section id="view-arcade" class="view active">
            <div class="grid" id="gameGrid"></div>
            <div id="loadMoreTrigger" style="height: 60px;"></div>
        </section>

        <section id="view-stats" class="view">
            <div class="stats-header">
                <h1 style="font-size: 32px; font-weight: 800; letter-spacing: -0.5px;">El teu Perfil</h1>
                <p style="opacity: 0.5; font-size: 15px;">Dades d'activitat i fites assolides.</p>
            </div>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Ratxa Actual</div>
                    <div class="stat-value">
                        <span id="stat-streak">0</span>
                        <i data-lucide="flame" class="streak-flame"></i>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Puntuació Total</div>
                    <div class="stat-value" id="stat-points">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Nivell</div>
                    <div class="stat-value" id="stat-level">Bronze</div>
                    <div style="width: 100%; height: 4px; background: var(--pill-bg); border-radius: 2px; margin-top: 4px;">
                        <div id="level-progress" style="width: 30%; height: 100%; background: var(--accent); border-radius: 2px;"></div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Temps Jugat</div>
                    <div class="stat-value" id="stat-time">0m</div>
                </div>
            </div>

            <div class="history-section">
                <div style="font-weight: 700; font-size: 18px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
                    <i data-lucide="activity" style="width:20px; color: var(--accent);"></i> Historial Detallat de Jocs
                </div>
                <div class="table-container">
                    <table id="historyTable">
                        <thead><tr><th>Joc</th><th style="text-align: center;">Partides</th><th style="text-align: center;">Temps</th><th style="text-align: right;">Última sessió</th></tr></thead>
                        <tbody id="historyBody"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section id="view-404" class="view">
            <div class="error-container">
                <i data-lucide="frown" style="width: 48px; height: 48px; opacity: 0.3;"></i>
                <h2 style="margin-top:15px; opacity: 0.8;">Sense resultats</h2>
                <button class="reset-btn" onclick="resetFilters()">Neteja la cerca</button>
            </div>
        </section>
    </div>

    <div class="category-container" id="categoryContainer">
        <div class="category-pill-wrapper" id="pillWrapper">
            <div class="category-active-bg" id="activePill"></div>
        </div>
    </div>

    <div id="gameModal" class="modal">
        <div class="modal-content">
            <button class="close-modal" id="closeModal"><i data-lucide="x"></i></button>
            <iframe id="gameIframe" src="" allow="autoplay; fullscreen; gamepad"></iframe>
            <div id="loaderOverlay" class="game-loader-overlay" style="display: none;">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <script src="assets/js/gameList.js"></script>

    <script>
        // ============================================
        // SERVICE WORKER (només registre, sense bloqueig)
        // ============================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(reg => console.log('SW registrat: ', reg.scope))
                    .catch(err => console.error('Error SW:', err));
            });
        }

        // ============================================
        // CONFIGURACIÓ I VARIABLES GLOBALS
        // ============================================
        const LOADER_DURATION = 7000;
        const ALLOWED_CATEGORIES = [
            { id: 'tots', label: 'Tots', icon: 'layout-grid' },
            { id: 'accio', label: 'Acció', icon: 'zap' },
            { id: 'puzle', label: 'Puzle', icon: 'brain' },
            { id: 'esports', label: 'Esports', icon: 'trophy' },
            { id: 'retro', label: 'Retro', icon: 'joystick' },
            { id: 'altres', label: 'Altres', icon: 'more-horizontal' }
        ];

        let ALL_GAMES = [];
        let FILTERED_GAMES = [];
        let currentCategory = 'tots';
        let itemsShown = 0;
        const CHUNK_SIZE = 30;

        let favorites = JSON.parse(localStorage.getItem('ulaFavorites')) || [];
        let userStats = JSON.parse(localStorage.getItem('ulaStats')) || {
            plays: 0, points: 0, timeSeconds: 0, streak: 0, lastDate: null, gameHistory: {}
        };

        let loaderTimeout = null;
        let isTransitioning = false;
        let fallbackTimeout = null;

        // ============================================
        // INICIALITZACIÓ DE JOCS I UI
        // ============================================
        window.addEventListener('load', () => {
            const pillWrapper = document.getElementById('pillWrapper');
            ALLOWED_CATEGORIES.forEach(cat => {
                const item = document.createElement('div');
                item.className = `category-item ${cat.id === 'tots' ? 'active' : ''}`;
                item.id = `cat-${cat.id}`;
                item.innerHTML = `<i data-lucide="${cat.icon}"></i> ${cat.label}`;
                item.onclick = () => selectCategory(cat.id);
                pillWrapper.appendChild(item);
            });

            checkStreak();
            lucide.createIcons();
            setTimeout(updateActivePillPosition, 100);
            updateLogoByTheme();

            document.getElementById('link-arcade').addEventListener('click', () => navigateToView('arcade', 'right'));
            document.getElementById('link-stats').addEventListener('click', () => navigateToView('stats', 'left'));

            if (typeof GAMES !== 'undefined') {
                ALL_GAMES = GAMES;
                applyFilters();
            }
        });

        function updateLogoByTheme() {
            const isDark = document.body.classList.contains('dark-theme');
            const logoSrc = isDark ? 'assets/icons/icon-large-dark.png' : 'assets/icons/icon-large-light.png';
            const logoImg = document.getElementById('logoImg');
            if (logoImg) logoImg.src = logoSrc;
        }

        function checkStreak() {
            const today = new Date().toDateString();
            if (userStats.lastDate) {
                const last = new Date(userStats.lastDate);
                const yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);
                if (last.toDateString() === yesterday.toDateString()) {
                    if (userStats.lastDate !== today) userStats.streak = (userStats.streak || 0) + 1;
                } else if (last.toDateString() !== today) userStats.streak = 1;
            } else userStats.streak = 1;
            userStats.lastDate = today;
            saveStats();
        }

        function saveStats() { localStorage.setItem('ulaStats', JSON.stringify(userStats)); }

        function selectCategory(catId) {
            currentCategory = catId;
            document.querySelectorAll('.category-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`cat-${catId}`).classList.add('active');
            updateActivePillPosition();
            applyFilters();
        }

        function updateActivePillPosition() {
            const activeEl = document.querySelector('.category-item.active');
            const pill = document.getElementById('activePill');
            if (activeEl && pill) {
                pill.style.width = `${activeEl.offsetWidth}px`;
                pill.style.left = `${activeEl.offsetLeft}px`;
            }
        }

        function sortGamesByFavorites(games) {
            return [...games].sort((a, b) => {
                const aFav = favorites.includes(a.url);
                const bFav = favorites.includes(b.url);
                if (aFav && !bFav) return -1;
                if (!aFav && bFav) return 1;
                return 0;
            });
        }

        function applyFilters() {
            const searchTerm = document.getElementById('gameSearch').value.toLowerCase();
            let filtered = ALL_GAMES.filter(g => {
                const matchesSearch = g.name.toLowerCase().includes(searchTerm);
                const matchesCat = currentCategory === 'tots' || (g.type && g.type.toLowerCase() === currentCategory);
                return matchesSearch && matchesCat;
            });
            FILTERED_GAMES = sortGamesByFavorites(filtered);
            if (FILTERED_GAMES.length === 0) showView('404', 'none');
            else { showView('arcade', 'none'); renderInitial(); }
        }

        function resetFilters() {
            document.getElementById('gameSearch').value = "";
            selectCategory('tots');
        }

        const grid = document.getElementById('gameGrid');
        const scrollContainer = document.getElementById('scrollContainer');
        const trigger = document.getElementById('loadMoreTrigger');
        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && itemsShown < FILTERED_GAMES.length) loadMore();
        }, { root: scrollContainer, threshold: 0.1 });
        observer.observe(trigger);

        function renderInitial() { grid.innerHTML = ""; itemsShown = 0; loadMore(); }

        function loadMore() {
            const nextBatch = FILTERED_GAMES.slice(itemsShown, itemsShown + CHUNK_SIZE);
            nextBatch.forEach((g, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'card-wrapper';
                const isFav = favorites.includes(g.url);
                if (isFav) wrapper.classList.add('favorite-card');
                wrapper.onclick = () => launchGame(g);
                const mediaContent = g.image ? `<img src="${g.image}" loading="lazy" onerror="this.style.display='none';">` : "";
                wrapper.innerHTML = `
                    <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite(event, '${g.url}')">
                        <i data-lucide="star" style="${isFav ? 'fill: #FFD60A' : ''}"></i>
                    </button>
                    <div class="card">
                        ${mediaContent}
                        <i data-lucide="gamepad-2" class="game-icon"></i>
                    </div>
                    <div class="card-title">${g.name}</div>
                `;
                grid.appendChild(wrapper);
                setTimeout(() => wrapper.classList.add('visible'), index * 20);
            });
            itemsShown += nextBatch.length;
            lucide.createIcons();
        }

        function navigateToView(targetViewId, direction) {
            if (isTransitioning) return;
            const currentView = document.querySelector('.view.active');
            if (currentView && currentView.id === `view-${targetViewId}`) return;

            isTransitioning = true;
            const nextView = document.getElementById(`view-${targetViewId}`);
            if (!nextView) return;

            let outDirection, inDirection;
            if (direction === 'left') { outDirection = 'left'; inDirection = 'right'; }
            else if (direction === 'right') { outDirection = 'right'; inDirection = 'left'; }
            else {
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                nextView.classList.add('active');
                updateActiveNavButton(targetViewId);
                isTransitioning = false;
                return;
            }

            if (currentView) {
                currentView.classList.remove('active');
                currentView.classList.add(`animate-out-${outDirection}`);
                setTimeout(() => {
                    currentView.classList.remove(`animate-out-${outDirection}`);
                    currentView.style.display = 'none';
                }, 300);
            }

            nextView.style.display = 'block';
            nextView.classList.add('active', `animate-in-${inDirection}`);
            setTimeout(() => {
                nextView.classList.remove(`animate-in-${inDirection}`);
                isTransitioning = false;
            }, 350);

            updateActiveNavButton(targetViewId);

            const catContainer = document.getElementById('categoryContainer');
            if (targetViewId === 'arcade' || targetViewId === '404') {
                catContainer.style.display = 'block';
                setTimeout(updateActivePillPosition, 100);
            } else {
                catContainer.style.display = 'none';
            }

            if (targetViewId === 'stats') updateStatsUI();
        }

        function updateActiveNavButton(viewId) {
            document.querySelectorAll('.nav-link').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`link-${viewId}`);
            if (activeBtn) activeBtn.classList.add('active');
        }

        function showView(viewId, direction) {
            if (direction === 'none') {
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                document.getElementById(`view-${viewId}`).classList.add('active');
                if (viewId === 'arcade' || viewId === '404') {
                    document.getElementById('categoryContainer').style.display = 'block';
                    setTimeout(updateActivePillPosition, 50);
                } else {
                    document.getElementById('categoryContainer').style.display = 'none';
                }
                if (viewId === 'stats') updateStatsUI();
            } else {
                navigateToView(viewId, direction);
            }
        }

        window.toggleFavorite = function(e, id) {
            e.stopPropagation();
            const idx = favorites.indexOf(id);
            if (idx > -1) favorites.splice(idx, 1);
            else favorites.push(id);
            localStorage.setItem('ulaFavorites', JSON.stringify(favorites));
            applyFilters();
        };

        function launchGame(game) {
            cancelLoaderTimer();
            cancelFallbackTimer();
            hideLoaderOverlayImmediate();

            currentGame = game;
            sessionStart = Date.now();
            const iframe = document.getElementById('gameIframe');
            iframe.src = `assets/games/${game.url.endsWith('.html') ? game.url : game.url + '.html'}`;
            document.getElementById('gameModal').classList.add('active');
            showLoaderOverlay();

            loaderTimeout = setTimeout(() => {
                hideLoaderOverlayImmediate();
                loaderTimeout = null;
            }, LOADER_DURATION);

            fallbackTimeout = setTimeout(() => {
                try {
                    if (!iframe.contentDocument || iframe.contentDocument.readyState !== 'complete') {
                        iframe.src = '/offline.html';
                        hideLoaderOverlayImmediate();
                        cancelLoaderTimer();
                    }
                } catch (e) {
                    iframe.src = '/offline.html';
                    hideLoaderOverlayImmediate();
                    cancelLoaderTimer();
                }
                fallbackTimeout = null;
            }, 10000);

            iframe.addEventListener('load', function onLoad() {
                clearTimeout(loaderTimeout);
                clearTimeout(fallbackTimeout);
                loaderTimeout = null;
                fallbackTimeout = null;
                hideLoaderOverlayImmediate();
                iframe.removeEventListener('load', onLoad);
            }, { once: true });

            userStats.plays = (userStats.plays || 0) + 1;
            userStats.points = (userStats.points || 0) + 15;
            saveStats();
        }

        let sessionStart = null;
        let currentGame = null;

        function hideLoaderOverlayImmediate() {
            const overlay = document.getElementById('loaderOverlay');
            if (overlay) {
                overlay.style.opacity = '0';
                setTimeout(() => {
                    overlay.style.display = 'none';
                    overlay.style.opacity = '';
                }, 500);
            }
        }
        function showLoaderOverlay() {
            const overlay = document.getElementById('loaderOverlay');
            if (overlay) {
                overlay.style.display = 'flex';
                overlay.style.opacity = '1';
            }
        }
        function cancelLoaderTimer() { if (loaderTimeout) { clearTimeout(loaderTimeout); loaderTimeout = null; } }
        function cancelFallbackTimer() { if (fallbackTimeout) { clearTimeout(fallbackTimeout); fallbackTimeout = null; } }

        document.getElementById('closeModal').onclick = () => {
            cancelLoaderTimer();
            cancelFallbackTimer();
            hideLoaderOverlayImmediate();
            if (sessionStart && currentGame) {
                const durationSec = Math.floor((Date.now() - sessionStart) / 1000);
                userStats.timeSeconds = (userStats.timeSeconds || 0) + durationSec;
                if (!userStats.gameHistory) userStats.gameHistory = {};
                if (!userStats.gameHistory[currentGame.name]) {
                    userStats.gameHistory[currentGame.name] = { count: 0, timePlayed: 0, lastPlayed: "" };
                }
                const gameEntry = userStats.gameHistory[currentGame.name];
                gameEntry.count = (gameEntry.count || 0) + 1;
                gameEntry.timePlayed = (gameEntry.timePlayed || 0) + durationSec;
                gameEntry.lastPlayed = new Date().toISOString();
                saveStats();
            }
            document.getElementById('gameModal').classList.remove('active');
            document.getElementById('gameIframe').src = "";
            sessionStart = null;
            currentGame = null;
        };

        document.getElementById('themeBtn').onclick = () => {
            const isDark = document.body.classList.toggle('dark-theme');
            const icon = document.getElementById('themeIcon');
            icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
            lucide.createIcons();
            updateLogoByTheme();
            const overlay = document.getElementById('loaderOverlay');
            if (overlay) overlay.style.background = 'var(--bg-base)';
        };

        function updateStatsUI() {
            document.getElementById('stat-streak').innerText = userStats.streak || 0;
            document.getElementById('stat-points').innerText = userStats.points || 0;
            const totalMinutes = Math.floor((userStats.timeSeconds || 0) / 60);
            document.getElementById('stat-time').innerText = totalMinutes + 'm';

            const points = userStats.points || 0;
            const levelEl = document.getElementById('stat-level');
            const progressEl = document.getElementById('level-progress');
            let level = "Novell";
            let progress = (points % 500) / 500 * 100;
            if (points > 2000) level = "Llegenda";
            else if (points > 1000) level = "Expert";
            else if (points > 500) level = "Pro";
            else if (points > 100) level = "Aficionat";
            levelEl.innerText = level;
            progressEl.style.width = `${progress}%`;

            const history = userStats.gameHistory || {};
            const sorted = Object.keys(history).sort((a, b) => {
                const dateA = history[a].lastPlayed ? new Date(history[a].lastPlayed) : 0;
                const dateB = history[b].lastPlayed ? new Date(history[b].lastPlayed) : 0;
                return dateB - dateA;
            });
            const historyBody = document.getElementById('historyBody');
            if (sorted.length === 0) {
                historyBody.innerHTML = '<tr><td colspan="4" style="opacity:0.5; padding:40px; text-align:center">Encara no has jugat a cap joc. Comença la teva aventura!</td></tr>';
            } else {
                historyBody.innerHTML = sorted.map(gameName => {
                    const g = history[gameName];
                    const totalSecs = g.timePlayed || 0;
                    const mins = Math.floor(totalSecs / 60);
                    const secs = totalSecs % 60;
                    const formattedTime = `${mins}m ${secs}s`;
                    const count = g.count || 0;
                    let lastPlayedFormatted = "Mai";
                    if (g.lastPlayed) {
                        const dateObj = new Date(g.lastPlayed);
                        lastPlayedFormatted = dateObj.toLocaleDateString('ca-ES', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
                    }
                    return `<tr>
                        <td>${gameName}</td>
                        <td style="text-align: center;"><span class="game-badge">${count}</span></td>
                        <td style="text-align: center;">${formattedTime}</td>
                        <td style="text-align: right;">${lastPlayedFormatted}</td>
                    </tr>`;
                }).join('');
            }
            lucide.createIcons();
        }

        document.getElementById('gameSearch').oninput = applyFilters;

        window.clearAllCache = function() {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.ready.then(reg => {
                    reg.active.postMessage({ type: 'CLEAR_CACHE' });
                });
            }
            localStorage.clear();
            alert('Cache netejat. Es recarregarà la pàgina.');
            window.location.reload();
        };
    </script>
</body>
</html>
