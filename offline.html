<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- La CSP també va al meta perquè GitHub Pages no permet capçaleres.
         El meta no admet `frame-ancestors`; la resta és igual que la de
         server.js. offline.html es mostra dins de l'iframe del joc, així
         que tampoc no l'hi volem. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; frame-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>Sense connexió</title>
    <style>
        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #09090b;
            color: #fafafa;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
        }

        ::selection { background: rgba(255, 255, 255, 0.2); }

        /* Fons ambiental: dues taques difuses que respiren. */
        .ambient {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .ambient span {
            position: absolute;
            left: 50%;
            border-radius: 50%;
            filter: blur(110px);
            animation: pulse 4s ease-in-out infinite;
        }

        .ambient .a {
            top: 25%;
            width: 24rem;
            height: 24rem;
            transform: translate(-50%, -50%);
            background: rgba(99, 102, 241, 0.1);
        }

        .ambient .b {
            bottom: 25%;
            width: 20rem;
            height: 20rem;
            transform: translate(-50%, 50%);
            background: rgba(139, 92, 246, 0.1);
            animation-delay: 2s;
        }

        main {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 28rem;
            margin: 0 auto;
            text-align: center;
            opacity: 0;
            animation: fade-in-up 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        h1 {
            margin: 0 0 0.75rem;
            font-size: 1.875rem;
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        p {
            margin: 0 auto 2rem;
            max-width: 24rem;
            color: #a1a1aa;
            font-size: 0.875rem;
            line-height: 1.6;
        }

        .actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.75rem;
            background: #fff;
            color: #0a0a0a;
            font: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            letter-spacing: 0.025em;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(255, 255, 255, 0.05);
            transition: background-color 0.2s, transform 0.2s;
        }

        button:hover { background: #e5e5e5; }
        button:active { transform: scale(0.98); }
        button[disabled] { opacity: 0.8; pointer-events: none; }

        button svg {
            width: 1rem;
            height: 1rem;
            margin-right: 0.5rem;
            flex-shrink: 0;
        }

        .spin { animation: spin 1s linear infinite; }

        @keyframes spin { to { transform: rotate(360deg); } }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: none; }
        }

        @media (min-width: 640px) {
            button { width: auto; }
            .actions { flex-direction: row; }
        }

        @media (prefers-reduced-motion: reduce) {
            .ambient span, main { animation: none; }
            main { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="ambient" aria-hidden="true">
        <span class="a"></span>
        <span class="b"></span>
    </div>

    <main>
        <h1 id="offlineTitle">Sense connexió</h1>
        <p id="offlineText">No s'ha pogut establir connexió amb el servidor. Comprova la teva xarxa i torna-ho a provar.</p>

        <div class="actions">
            <button id="retryBtn" type="button">
                <svg id="retryIcon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"></path>
                </svg>
                <span id="btnText">Reintentar connexió</span>
            </button>
        </div>
    </main>

    <!-- Sense codi en línia: la CSP no ho permet i aquí no cal. -->
    <script src="assets/js/offline.js"></script>
</body>
</html>
